<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Aftershift — Live courts</title>
<script>
(function(){var t;try{t=localStorage.getItem('aspc-theme')}catch(e){}
  var d=t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme=d?'dark':'light';})();
</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== COLOURS — same as the website ===== */
:root{
  --bg:#EEEDEC;--card:#F7F6F4;--soft:#E1E0DE;--ink:#24211C;--muted:#6E733B;--line:#D7D5D1;
  --accent:#B5C42F;--accent-ink:#24211C;--accent-text:#66740F;--logo-lime:#A9BC2A;
  --next:#EEF2D6;--then:#F3F2EF;--live:#D0553F;--paused:#9A7B2E;
  --glow:rgba(181,196,47,.28);--shadow:0 1px 2px rgba(36,33,28,.05),0 14px 30px -24px rgba(36,33,28,.45);
  --serif:"DM Serif Display",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#171715;--card:#242320;--soft:#2E2D29;--ink:#F0EFEC;--muted:#AEB876;--line:#393831;
  --accent:#C2D437;--accent-ink:#171715;--accent-text:#C2D437;--logo-lime:#C2D437;
  --next:#2C3018;--then:#27261F;--paused:#D9B45A;
  --glow:rgba(194,212,55,.14);--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:600 16px/1.35 var(--sans);transition:background .25s,color .25s}
.tv{min-height:100vh;padding:1rem clamp(1rem,2.5vw,2.5rem) 1rem;
  background:radial-gradient(60% 40% at 50% 0%,var(--glow),transparent 70%),var(--bg)}
.idle{cursor:none}

/* logo — same drawing as the website */
.logo{display:block;height:clamp(52px,5.5vw,84px);width:auto;overflow:visible}
.lg-ink{fill:var(--ink)}.lg-lime{fill:var(--logo-lime)}.lg-hole{fill:var(--bg)}
.lg-dash{stroke:var(--logo-lime);stroke-width:3;stroke-linecap:round}
