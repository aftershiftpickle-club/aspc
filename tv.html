<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aftershift — Live courts</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--panel:#131313;--edge:#262626;--ink:#F4F5F0;--muted:#8E958A;--volt:#C7D92C;--red:#E2543B}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080808;color:var(--ink);font:600 16px/1.4 "Montserrat",system-ui,sans-serif}
.tv{min-height:100vh;padding:1.2rem clamp(1rem,2.5vw,2.5rem) 1rem;background:radial-gradient(60% 40% at 50% 0%,rgba(199,217,44,.08),transparent 70%),#080808}
.idle{cursor:none}
.tvtop{display:flex;align-items:center;gap:1.2rem;margin-bottom:1rem}
.brandline{display:flex;align-items:center;gap:.6rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:clamp(1rem,1.6vw,1.6rem)}
.ball{width:1.6em;height:1.6em;border-radius:50%;flex:none;background:radial-gradient(circle,#080808 20%,transparent 23%) 2px 2px/.5em .5em,var(--volt)}
.live{color:var(--red);display:flex;align-items:center;gap:.35rem;font-size:.75em}
.dot{width:.55em;height:.55em;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.title{flex:1;text-align:center;font-family:"Anton",Impact,sans-serif;text-transform:uppercase;font-size:clamp(1.3rem,2.4vw,2.6rem);color:var(--volt)}
.clock{font-family:"Anton",Impact,sans-serif;font-size:clamp(1.4rem,2.6vw,2.8rem);font-variant-numeric:tabular-nums}
.fs{border:0;background:none;color:var(--muted);font:700 .8rem "Montserrat";border:1.5px solid var(--edge);border-radius:999px;padding:.45rem .8rem;cursor:pointer}
.idle .fs{visibility:hidden}
.div{margin-bottom:1.3rem}
.dh{display:flex;align-items:baseline;gap:1rem;border-bottom:2px solid var(--edge);margin-bottom:.8rem;padding-bottom:.3rem}
.dh h2{font-family:"Anton",Impact,sans-serif;text-transform:uppercase;font-size:clamp(1.4rem,2.4vw,2.6rem);margin:0;font-weight:400}
.dh span{color:var(--muted);font-weight:700;font-size:clamp(.8rem,1.1vw,1.2rem)}
.grid{display:grid;grid-template-columns:1fr minmax(260px,28%);gap:1rem}
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;align-content:start}
.c{background:var(--panel);border:2px solid var(--edge);border-radius:18px;overflow:hidden}
.c.done{border-color:var(--red)}
.c header{display:flex;justify-content:space-between;align-items:center;padding:.6rem 1rem;background:#0F0F0F}
.c header b{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(1.1rem,1.8vw,2rem)}
.timer{font-family:"Anton",Impact,sans-serif;color:var(--volt);font-size:clamp(1.3rem,2.2vw,2.4rem);font-variant-numeric:tabular-nums}
.timer.up{color:var(--red)}
.body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.6rem;padding:1.1rem 1rem}
.team{display:grid;gap:.35rem;font-weight:800;font-size:clamp(1.1rem,1.9vw,2.1rem);line-height:1.15}
.team:last-child{text-align:right}
.vs{font-family:"Anton",Impact,sans-serif;color:#4a5040;font-size:clamp(1rem,1.5vw,1.6rem)}
.bar{height:5px;background:#1c1c1c}.bar i{display:block;height:100%;background:var(--volt);transition:width 1s linear}
.free{padding:1.7rem 1rem;text-align:center;color:var(--volt);font-family:"Anton",Impact,sans-serif;text-transform:uppercase;font-size:clamp(1.2rem,2vw,2.2rem)}
.side{display:grid;gap:1rem;align-content:start}
.box{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:.9rem 1.1rem}
.box h3{margin:0 0 .5rem;font-size:clamp(.7rem,.9vw,1rem);letter-spacing:.2em;text-transform:uppercase;color:var(--volt)}
.box.next{border-color:rgba(199,217,44,.55);background:linear-gradient(#1a1d0c,#131313)}
.nextl{margin:0;padding-left:1.8em;font-weight:800;font-size:clamp(1rem,1.6vw,1.8rem)}
.q{margin:0;padding-left:2.2em;column-count:2;column-gap:1.5rem;font-weight:700;font-size:clamp(.95rem,1.35vw,1.5rem)}
.q li{break-inside:avoid;margin-bottom:.2rem}
li::marker{color:var(--muted)}
.dim{color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:clamp(.75rem,1vw,1.1rem);padding-top:.4rem}
.wait{min-height:70vh;display:grid;place-items:center;text-align:center}
.wait h1{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;color:var(--volt);font-size:clamp(2rem,6vw,5rem);margin:0}
.offline{position:fixed;right:1rem;bottom:1rem;background:var(--red);color:#fff;font-weight:800;font-size:.8rem;padding:.4rem .8rem;border-radius:999px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" class="tv"><div class="wait"><h1>Loading…</h1></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ====== YOUR SUPABASE PROJECT (same as admin.html) ====== */
const SUPABASE_URL = 'https://wczulosdzoewznxlawfj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZPRnMslT6BWplkRvVaiRXA_PUh-bQlO';
const GAME_SECONDS = 600;
const FOOTER = 'Just arrived? Check in with Bon or Jes to join the queue';
/* ======================================================== */

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const DIVS = {regular:'Regular', ascend:'Ascend'};
let players={}, session=null, roster=[], courts=[], offline=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=id=>esc((players[id]||{name:id}).name);
const ms=t=>t?new Date(t).getTime():0;
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const now=()=>new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const remaining=c=>c.started_at?Math.max(0,GAME_SECONDS-Math.floor((Date.now()-ms(c.started_at))/1000)):GAME_SECONDS;
function queueOf(div){return roster.filter(e=>e.status==='queued'&&(players[e.player_id]||{}).division===div)
  .sort((a,b)=>ms(a.queue_ticket)-ms(b.queue_ticket)||a.player_id.localeCompare(b.player_id)).map(e=>e.player_id);}

async function load(){
  try{
    const [p,s]=await Promise.all([sb.from('players').select('id,name,division'),
      sb.from('sessions').select('*').eq('status','live').order('session_date',{ascending:false}).limit(1)]);
    if(p.error||s.error) throw p.error||s.error;
    players=Object.fromEntries(p.data.map(x=>[x.id,x]));
    session=s.data[0]||null;
    if(session){
      const [r,c]=await Promise.all([sb.from('session_players').select('player_id,status,queue_ticket').eq('session_id',session.id),
        sb.from('courts').select('*').eq('session_id',session.id).order('id')]);
      if(r.error||c.error) throw r.error||c.error;
      roster=r.data; courts=c.data;
    }
    offline=false;
  }catch(e){console.error(e);offline=true;}
  render();
}

function render(){
  const off=offline?'<div class="offline">Reconnecting…</div>':'';
  if(!session){$('#app').innerHTML=`<div class="wait"><div><div class="brandline" style="justify-content:center;margin-bottom:1rem"><span class="ball"></span>Aftershift</div>
    <h1>Courts open soon</h1><p class="dim">This screen switches on by itself when an organiser taps “Go live”.</p></div></div>${off}`;return;}
  const block=d=>{const cs=courts.filter(c=>c.division===d);if(!cs.length)return '';
    const q=queueOf(d),next=q.slice(0,4),later=q.slice(4);
    return `<section class="div"><div class="dh"><h2>${DIVS[d]}</h2><span>${q.length} in queue</span></div>
    <div class="grid"><div class="courts">${cs.map(court).join('')}</div>
    <div class="side"><div class="box next"><h3>Next up</h3>${next.length>=4?`<ol class="nextl">${next.map(id=>`<li>${nm(id)}</li>`).join('')}</ol>`
        :`<div class="dim">Waiting for ${4-next.length} more player${4-next.length>1?'s':''}</div>`}</div>
      <div class="box"><h3>Then</h3>${later.length?`<ol class="q" start="5">${later.slice(0,12).map(id=>`<li>${nm(id)}</li>`).join('')}</ol>${later.length>12?`<div class="dim">+${later.length-12} more</div>`:''}`:'<div class="dim">—</div>'}</div></div></div></section>`;};
  $('#app').innerHTML=`<header class="tvtop"><div class="brandline"><span class="ball"></span>Aftershift<span class="live"><i class="dot"></i>LIVE</span></div>
    <div class="title">${esc(session.label||'Open play')}</div><div class="clock" id="clock">${now()}</div>
    <button class="fs" id="fs">⛶ Full screen</button></header>
    ${block('regular')}${block('ascend')}<div class="foot">${esc(FOOTER)}</div>${off}`;
}
function court(c){
  if(!(c.team_a||[]).length) return `<article class="c"><header><b>${esc(c.label)}</b></header><div class="free">Court free — next four, get ready</div></article>`;
  const r=remaining(c),t=ids=>ids.map(id=>`<span>${nm(id)}</span>`).join('');
  return `<article class="c ${r===0?'done':''}" data-court="${c.id}"><header><b>${esc(c.label)}</b><span class="timer ${r===0?'up':''}">${r===0?"TIME'S UP":fmt(r)}</span></header>
    <div class="body"><div class="team">${t(c.team_a)}</div><div class="vs">VS</div><div class="team">${t(c.team_b)}</div></div>
    <div class="bar"><i style="width:${(GAME_SECONDS-r)/GAME_SECONDS*100}%"></i></div></article>`;
}

/* clock + timers every second */
setInterval(()=>{
  const ck=$('#clock');if(ck)ck.textContent=now();
  courts.forEach(c=>{const el=document.querySelector(`[data-court="${c.id}"]`);if(!el)return;const r=remaining(c);
    const tm=el.querySelector('.timer');tm.textContent=r===0?"TIME'S UP":fmt(r);tm.classList.toggle('up',r===0);
    el.classList.toggle('done',r===0);el.querySelector('.bar i').style.width=((GAME_SECONDS-r)/GAME_SECONDS*100)+'%';});
},1000);

/* instant updates when an organiser changes anything, plus a safety refresh */
let h;const soon=()=>{clearTimeout(h);h=setTimeout(load,300);};
sb.channel('aspc-tv')
  .on('postgres_changes',{event:'*',schema:'public',table:'session_players'},soon)
  .on('postgres_changes',{event:'*',schema:'public',table:'courts'},soon)
  .subscribe();
setInterval(load,15000);

/* full screen + hide the mouse pointer when idle */
document.addEventListener('click',e=>{if(e.target.id==='fs'){const d=document.documentElement;
  if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen().catch(()=>{});}});
let idle;document.addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>document.body.classList.add('idle'),3000);});

load();
</script>
</body>
</html>
