<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ASPC Admin</title>
<script>
(function(){var t;try{t=localStorage.getItem('aspc-theme')}catch(e){}
  var d=t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme=d?'dark':'light';})();
</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== COLOURS — same as the website (light first, dark below) ===== */
:root{
  --bg:#EEEDEC;--card:#F7F6F4;--soft:#E1E0DE;--ink:#24211C;--muted:#6E733B;--line:#D7D5D1;--line2:#C4C1BA;
  --accent:#B5C42F;--accent-ink:#24211C;--accent-text:#66740F;--logo-lime:#A9BC2A;
  --red:#C4553F;--asc:#8A6A2E;--asc-bg:#F1EADB;--next:#EEF2D6;--then:#F3F2EF;--sel:rgba(181,196,47,.35);
  --topbar:rgba(238,237,236,.92);--r:14px;
  --shadow:0 1px 2px rgba(36,33,28,.05),0 10px 26px -20px rgba(36,33,28,.35);
  --serif:"DM Serif Display",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#171715;--card:#242320;--soft:#2E2D29;--ink:#F0EFEC;--muted:#AEB876;--line:#393831;--line2:#4A4940;
  --accent:#C2D437;--accent-ink:#171715;--accent-text:#C2D437;--logo-lime:#C2D437;
  --red:#E0735C;--asc:#D9B45A;--asc-bg:#2E2A1F;--next:#2C3018;--then:#27261F;--sel:rgba(194,212,55,.3);
  --topbar:rgba(23,23,21,.9);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--muted);font:400 15px/1.55 var(--sans);transition:background .25s,color .25s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{width:min(1180px,100% - 2rem);margin-inline:auto}
.grow{flex:1}.dim{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.loading{text-align:center;padding:4rem 1rem}
.demo{background:var(--accent);color:var(--accent-ink);text-align:center;font-weight:800;font-size:.8rem;padding:.45rem 1rem}
.offbar{background:var(--red);color:#fff;text-align:center;font-weight:800;font-size:.82rem;padding:.55rem 1rem}

/* logo — same drawing as the website */
.logo{display:block;height:50px;width:auto;overflow:visible}
.lg-ink{fill:var(--ink)}.lg-lime{fill:var(--logo-lime)}.lg-hole{fill:var(--bg)}
.lg-dash{stroke:var(--logo-lime);stroke-width:3;stroke-linecap:round}
.lg-word{font-family:var(--sans);font-weight:800}.lg-sub{font-family:var(--sans);font-weight:700}
.brand{display:flex;align-items:center;text-decoration:none}
.adm-badge{font-size:.6rem;font-weight:800;letter-spacing:.16em;background:var(--ink);color:var(--bg);border-radius:6px;padding:.2rem .45rem}

.atop{position:sticky;top:0;z-index:40;background:var(--topbar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.atop-in{display:flex;align-items:center;gap:.6rem;min-height:64px;flex-wrap:wrap;padding:.4rem 0}
.sync{display:flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:700;color:var(--accent-text);border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:.28rem .65rem;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
.sync.off{color:var(--muted)}.sync.off i{background:var(--muted);animation:none}
.sync.save i{animation:none}
.sync.save.saving{color:var(--asc)}.sync.save.saving i{background:var(--asc);animation:pulse .8s infinite}
.sync.save.err{color:var(--red);border-color:var(--red);cursor:pointer}.sync.save.err i{background:var(--red)}
.sync.save.offline{color:var(--red);border-color:var(--red)}.sync.save.offline i{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.ctl{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;display:grid;place-items:center}
.ctl:hover{border-color:var(--accent)}
.atabs{border-bottom:1px solid var(--line);background:var(--card)}
.atabs button{border:0;background:none;color:var(--muted);font-weight:700;font-size:.86rem;padding:.85rem 1rem;border-bottom:2px solid transparent;white-space:nowrap}
.atabs button[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
footer{border-top:1px solid var(--line);padding:1.4rem 0 5rem;margin-top:2.5rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}

.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;padding:.62rem 1rem;border-radius:999px;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn.quiet{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.quiet:hover{box-shadow:inset 0 0 0 1.5px var(--accent);filter:none}
.btn.danger{background:var(--card);color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.btn.sm{padding:.42rem .75rem;font-size:.66rem}
.btn.w{width:100%}
.field{display:grid;gap:.35rem;margin-bottom:.9rem}
.field label,.flabel{font-size:.66rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.inp{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:.55rem .8rem;color:var(--ink);font-weight:600;width:100%}
.inp:focus{border-color:var(--accent);outline:0}
.inp.sm{width:auto;padding:.38rem .6rem;font-size:.82rem}
.chk{display:flex;align-items:center;gap:.45rem;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--ink)}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.mm{display:flex;align-items:center;gap:.45rem;font-size:.8rem;font-weight:700;color:var(--ink)}
.seg{display:flex;gap:3px;background:var(--soft);border-radius:999px;padding:3px;width:max-content}
.seg button{border:0;background:none;color:var(--muted);font-weight:700;font-size:.78rem;padding:.42rem .9rem;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip{font-size:.6rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:.16rem .5rem;border:1px solid;white-space:nowrap;display:inline-block}
button.chip{cursor:pointer;font-family:inherit}
.chip.regular{color:var(--accent-text);border-color:var(--line2);background:var(--next)}
.chip.ascend{color:var(--asc);border-color:var(--line2);background:var(--asc-bg)}
.chip.social{color:var(--bg);border-color:var(--ink);background:var(--ink)}
.chip.org,.chip.ended,.chip.planned,.chip.plain{color:var(--muted);border-color:var(--line);background:var(--card)}
.chip.live{color:#fff;background:var(--red);border-color:var(--red)}
.chip.pub{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.chip.draft{color:var(--asc);border-color:var(--line2);background:var(--asc-bg)}
.chip.prep{color:var(--accent-text);border-color:var(--accent);background:var(--next)}
.chip.tv{color:var(--ink);border-color:var(--line2);background:var(--card);font-size:.66rem;padding:.3rem .65rem}
.chip.notv{color:var(--asc);border-color:var(--asc);background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow)}
.box h3{margin:0 0 .75rem;font-size:.7rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text)}
.av{--s:36px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);border:1.5px solid var(--line2);font:800 calc(var(--s)*.34) var(--sans);color:var(--accent-text)}
.av.ascend{background:var(--asc-bg);color:var(--asc)}
.av.ph{background-size:cover;background-position:center}
.av.big{border-width:3px}

.login{min-height:100vh;display:grid;place-items:center;padding:2rem 1rem;background:radial-gradient(50% 40% at 50% 100%,var(--sel),transparent 70%)}
.login .card{width:min(420px,100%);padding:2rem;overflow:visible}
.login .logo{height:78px}
.login h1{font-family:var(--serif);font-weight:400;font-size:2rem;color:var(--ink);margin:1.2rem 0 .2rem}
.login p{margin:0 0 1.3rem;font-size:.88rem}
.stackbtns{display:grid;gap:.6rem}

.sessbar{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem;margin-top:1.3rem;box-shadow:var(--shadow)}
.sessbar>.inp{width:auto;max-width:100%}
.cpanel{margin-top:.8rem}
.cgrid{display:flex;gap:.5rem;flex-wrap:wrap}
.ctog{display:flex;align-items:center;gap:.5rem;border:1.5px solid var(--line);border-radius:12px;padding:.45rem .7rem;cursor:pointer;background:var(--bg)}
.ctog.on{border-color:var(--accent);background:var(--next)}
.ctog input{accent-color:var(--accent);width:16px;height:16px}
.ctog b{display:block;color:var(--ink);font-size:.85rem;line-height:1.1}
.ctog small{font-size:.66rem;font-weight:700}
.tvrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding:.7rem .8rem;margin:0 0 .9rem;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.tvrow b{color:var(--ink);font-size:.88rem}
.rule{margin-top:1rem;border-left:3px solid var(--accent);background:var(--card);padding:.65rem 1rem;border-radius:0 10px 10px 0;font-size:.84rem}
.rule b{color:var(--ink)}
.empty{text-align:center;padding:3rem 1rem}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:1.6rem 0 1rem}
.sec-head h2{font-family:var(--serif);font-weight:400;font-size:1.9rem;margin:0;color:var(--ink)}
.sec-head p{margin:.2rem 0 0;font-size:.86rem;max-width:62ch}

/* ---- court cards ---- */
.adiv{margin-top:1.8rem}
.adiv-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;flex-wrap:wrap}
.adiv-head h2{font-family:var(--serif);font-weight:400;font-size:1.7rem;margin:0;color:var(--ink)}
.linkish{border:0;background:none;color:var(--muted);font-weight:700;font-size:.8rem;margin-left:auto;text-decoration:underline;text-underline-offset:3px}
.linkish:hover{color:var(--accent-text)}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.acourt{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.acourt.done{border-color:var(--red)}
.acourt.free{border-style:dashed;border-color:var(--line2);box-shadow:none;background:transparent}
.acourt.prep{border-style:dashed;border-color:var(--accent);box-shadow:none}
.acourt header{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.55rem .6rem .55rem 1rem;background:var(--soft);min-height:48px}
.acourt.free header{background:transparent}
.acourt.prep header{background:var(--next)}
.acourt header .ttl{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.acourt header b{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;color:var(--ink)}
.hc{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
.timer{font:800 1.2rem var(--sans);color:var(--accent-text);font-variant-numeric:tabular-nums;margin-right:.2rem}
.timer.up{color:var(--red)}
.timer.paused{color:var(--asc)}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;height:30px;min-width:30px;padding:0 .55rem;font-size:.72rem;font-weight:800;color:var(--ink);white-space:nowrap}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn.sw{border-color:var(--accent);color:var(--accent-text)}
.ac-body{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center;padding:.8rem}
.team{display:grid;gap:.35rem;justify-items:stretch}
.t2{justify-items:end}
.vs{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:1.1rem}
.slot{display:flex;align-items:center;gap:.45rem;width:100%;border:1.5px solid transparent;background:var(--bg);border-radius:10px;padding:.3rem .45rem;font-weight:700;color:var(--ink);text-align:left;min-height:40px;font-size:.88rem}
.slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot:hover{border-color:var(--line2)}
.slot.sel{border-color:var(--accent);background:var(--next);box-shadow:0 0 0 3px var(--sel)}
.slot.empty{border:1.5px dashed var(--line2);background:transparent;color:var(--muted);justify-content:center;font-weight:600;font-size:.8rem}
.slot.empty.sel{border-style:solid;border-color:var(--accent)}
.t2 .slot{flex-direction:row-reverse;text-align:right}
.score-in{width:70px;text-align:center;font:800 1.3rem var(--sans);border:1.5px solid var(--accent);border-radius:10px;padding:.25rem;color:var(--ink);background:var(--card);justify-self:center}
.t2 .score-in{justify-self:center}
.sugg{margin:0 .8rem .6rem;padding:.55rem .75rem;border-radius:10px;background:var(--next);font-size:.82rem}
.sugg b{color:var(--ink)}
.free-msg{padding:0 1rem 1rem;text-align:center;font-weight:600;font-size:.84rem}
.ac-act{display:flex;gap:.5rem;padding:0 .8rem .8rem;margin-top:auto}
.ac-act .btn{flex:1}
.offrow{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.8rem;font-size:.78rem;font-weight:700}
.prep-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1.2rem 0 .7rem}
.prep-head h3{margin:0;font-size:.7rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text)}
.prep-hint{font-size:.82rem;margin:0}

/* ---- waiting list ----
   Every row uses the SAME fixed column widths so the headings
   (GP, W–L, Wait, Last game) line up with the numbers below them. */
.waitbox{margin-top:1rem}
.upnext{display:grid;gap:.3rem;margin:0 0 .8rem;font-size:.85rem;color:var(--ink);font-weight:600}
.wl{list-style:none;margin:0;padding:0;display:grid;gap:.3rem}
.wr{display:grid;grid-template-columns:minmax(0,1fr) 38px 52px 60px 72px 124px;align-items:center;gap:.5rem;padding:.3rem .5rem;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.wr.head{background:none;border:0;font-size:.6rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:0 .5rem}
.wr.g1{border-color:var(--accent);background:var(--next)}
.wr.g2{border-color:var(--line2);background:var(--then)}
.wr.lined{border-style:dashed;border-color:var(--accent);opacity:.8}
.wr.sel{box-shadow:0 0 0 3px var(--sel);border-color:var(--accent)}
.wmain{display:flex;align-items:center;gap:.45rem;border:0;background:none;padding:0;text-align:left;min-width:0}
.wmain b{color:var(--ink);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qn{width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:.68rem;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.g1 .qn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.g2 .qn{background:var(--soft);border-color:var(--line2)}
.wc{font-size:.8rem;font-weight:700;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.wc.dim{color:var(--muted);font-weight:600}
.nx{font-size:.58rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:.12rem .45rem;margin-right:.35rem}
.nx.n1{background:var(--accent);color:var(--accent-ink)}.nx.n2{background:var(--soft);color:var(--ink)}
.qa{display:flex;gap:2px;justify-content:flex-end}
.qa button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:6px;min-width:28px;height:28px;font-size:.72rem;padding:0 .3rem}
.qa button:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qa button:disabled{opacity:.3;cursor:default}
.qa button.txt{padding:0 .55rem;font-weight:700}
.rest{list-style:none;margin:.5rem 0 0;padding:0;display:grid;gap:.3rem}
.rest li{display:flex;align-items:center;gap:.5rem;padding:.3rem .5rem;border-radius:10px;border:1px dashed var(--line2)}
.rest b{flex:1;color:var(--ink);font-size:.86rem}

/* ---- selection bar ---- */
.selbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);border-radius:14px;padding:.55rem .6rem .55rem 1rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;width:max-content;max-width:calc(100% - 2rem);box-shadow:0 14px 30px -10px rgba(0,0,0,.4);font-size:.84rem}
.selbar b{color:var(--accent)}
html[data-theme="dark"] .selbar b{color:var(--accent-text);filter:brightness(.55)}
.selbar button{border:0;border-radius:999px;padding:.42rem .8rem;font-weight:800;font-size:.72rem;background:var(--accent);color:var(--accent-ink)}
.selbar button:hover{filter:brightness(1.08)}

/* ---- pool ---- */
.tools{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.search{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:.55rem .85rem;min-width:220px;color:var(--ink)}
.search:focus{border-color:var(--accent);outline:0}
.stat{font-size:.78rem;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.3rem .7rem;font-weight:600}
.stat b{color:var(--accent-text)}
.poolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:.85rem;margin-top:1rem}
.pc{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:1.2rem .9rem .9rem;display:flex;flex-direction:column;align-items:center;gap:.45rem;text-align:center;box-shadow:var(--shadow)}
.pc.in{border-color:var(--accent)}
.pc.out{opacity:.6;box-shadow:none}.pc.out:hover{opacity:1}
.pc>b{color:var(--ink)}
.pick{position:absolute;top:.6rem;left:.6rem}
.pick input{position:absolute;opacity:0;width:26px;height:26px;margin:0;cursor:pointer}
.pick span{display:block;width:26px;height:26px;border-radius:7px;border:2px solid var(--line2);background:var(--card);pointer-events:none}
.pick input:checked+span{background:var(--accent);border-color:var(--accent)}
.pick input:checked+span::after{content:"✓";display:grid;place-items:center;color:var(--accent-ink);font-weight:900;height:100%}
.edit{position:absolute;top:.55rem;right:.55rem;border:0;background:none;color:var(--muted);font-size:.72rem;font-weight:700}
.edit:hover{color:var(--accent-text)}
.pc-photo{border:0;background:none;padding:0;position:relative}
.addph{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);font-style:normal;font-size:.6rem;font-weight:800;background:var(--ink);color:var(--bg);border-radius:999px;padding:.1rem .45rem;white-space:nowrap}
.pc-meta{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center}
.dupr{font-size:.68rem;font-weight:800;border-radius:999px;padding:.18rem .55rem;background:var(--next);color:var(--ink)}
.dupr.none{background:var(--bg);color:var(--muted)}
.st{font-size:.72rem;font-weight:800;border-radius:6px;padding:.15rem .5rem}
.st.exp{background:var(--soft);color:var(--muted)}.st.q{background:var(--accent);color:var(--accent-ink)}.st.c{background:var(--ink);color:var(--bg)}.st.r{background:var(--asc-bg);color:var(--asc)}
.arr{display:flex;gap:.35rem;align-items:center;width:100%;margin-top:.2rem}
.arr .inp{padding:.4rem .5rem;flex:1;min-width:0}
.lbl2{font-size:.6rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}

/* ---- results ---- */
.rrow{display:grid;grid-template-columns:120px 1fr auto 1fr auto;gap:.8rem;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--line);font-size:.88rem}
.rrow:last-child{border-bottom:0}
.rrow .sc{font:800 1.1rem var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.1rem .6rem}
.rrow .won{font-weight:800;color:var(--ink)}.rrow .lost{color:var(--muted)}.rrow .b{text-align:right}
.rrow .acts{display:flex;gap:.35rem}

function fakeClient(DB){
  let nextId=1000;const clone=x=>JSON.parse(JSON.stringify(x));
  class Q{
    constructor(t){this.t=t;this.f=[];this.op='select';this.one=false;this.lim=null;this.ord=null;}
    select(){return this}
    insert(r){this.op='insert';this.rows=[].concat(r);return this}
    update(p){this.op='update';this.patch=p;return this}
    delete(){this.op='delete';return this}
    upsert(r,o={}){this.op='upsert';this.rows=[].concat(r);this.keys=(o.onConflict||'id').split(',');return this}
    eq(c,v){this.f.push(r=>r[c]==v);return this}
    neq(c,v){this.f.push(r=>r[c]!=v);return this}
    in(c,a){this.f.push(r=>a.includes(r[c]));return this}
    order(c,o={}){this.ord=[c,o.ascending!==false];return this}
    limit(n){this.lim=n;return this}
    single(){this.one=true;return this}
    then(res){try{res({data:this.run(),error:null})}catch(e){res({data:null,error:e})}}
    run(){const T=DB[this.t]||(DB[this.t]=[]),ok=r=>this.f.every(f=>f(r));
      if(this.op==='insert'){const out=this.rows.map(r=>{const x=clone(r);if(['sessions','courts','matches'].includes(this.t)&&x.id==null)x.id=nextId++;
        if(this.t==='matches'&&!x.created_at)x.created_at=new Date().toISOString();T.push(x);return clone(x)});return this.one?out[0]:out;}
      if(this.op==='update'){const m=T.filter(ok);m.forEach(r=>Object.assign(r,clone(this.patch)));return clone(m)}
      if(this.op==='delete'){DB[this.t]=T.filter(r=>!ok(r));return []}
      if(this.op==='upsert'){this.rows.forEach(r=>{const e=T.find(x=>this.keys.every(k=>x[k]==r[k]));e?Object.assign(e,clone(r)):T.push(clone(r))});return clone(this.rows)}
      let out=T.filter(ok);if(this.ord){const[c,a]=this.ord;out=[...out].sort((x,y)=>(x[c]>y[c]?1:x[c]<y[c]?-1:0)*(a?1:-1))}
      if(this.lim!=null)out=out.slice(0,this.lim);out=clone(out);return this.one?out[0]:out;}
  }
  const user={email:'demo@aftershift.club'};
  return {from:t=>new Q(t),
    auth:{getSession:async()=>({data:{session:{user}}}),signInWithPassword:async()=>({data:{user}}),signOut:async()=>({})},
    storage:{from:()=>({upload:async()=>({data:{},error:null}),getPublicUrl:()=>({data:{publicUrl:''}})})},
    channel:()=>{const ch={on:()=>ch,subscribe:cb=>{cb&&cb('SUBSCRIBED');return ch}};return ch},removeChannel:()=>{}};
}

const csvCell=v=>{v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
const slug=s=>String(s||'session').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

function resultsCSV(snap){
  const nm=id=>(snap.players[id]&&snap.players[id].name)||id,team=ids=>(ids||[]).filter(Boolean).map(nm).join(' & ');
  const list=[...snap.matches].sort((a,b)=>ms(a.created_at)-ms(b.created_at));
  const L=[[`Aftershift Pickleclub — ${snap.session.label||'Session'} — ${snap.session.session_date}`],[],['GAMES'],
    ['Division','Game','Court','Team 1','Team 2','Score 1','Score 2','Winner','Recorded at']];
  list.forEach(m=>{const aw=m.score1>m.score2;
    L.push([DIVS[m.division]||m.division,m.game,m.court,team(m.team1),team(m.team2),m.score1,m.score2,aw?team(m.team1):team(m.team2),
      m.created_at?new Date(m.created_at).toLocaleString():'']);});
  const st={};list.forEach(m=>{const aw=m.score1>m.score2,df=m.score1-m.score2;
    const add=(id,won,d)=>{const k=m.division+'|'+id,x=st[k]||(st[k]={div:m.division,id,w:0,l:0,d:0});won?x.w++:x.l++;x.d+=d;};
    (m.team1||[]).forEach(id=>add(id,aw,df));(m.team2||[]).forEach(id=>add(id,!aw,-df));});
  L.push([],['STANDINGS'],['Division','Player','Played','Won','Lost','Win %','Point diff']);
  Object.values(st).sort((a,b)=>a.div.localeCompare(b.div)||(b.w/(b.w+b.l))-(a.w/(a.w+a.l))||b.d-a.d)
    .forEach(x=>L.push([DIVS[x.div]||x.div,nm(x.id),x.w+x.l,x.w,x.l,Math.round(x.w/(x.w+x.l)*100)+'%',x.d]));
  L.push([],[`Saved ${new Date(snap.savedAt).toLocaleString()}`]);
  return '\ufeff'+L.map(r=>r.map(csvCell).join(',')).join('\r\n');
}

/* ---------- loading ----------
   bg = true means "background reload" (live sync / the 20-second check).
   If an action started or finished while the data was being fetched, the
   fetched copy may be half-updated, so it is dropped (returns false) and
   the reload is tried again a moment later.                             */
async function loadAll(bg){
  const e=epoch;
  const [p,pp,s]=await Promise.all([sb.from('players').select('*').order('name'),sb.from('player_private').select('*'),
    sb.from('sessions').select('*').order('session_date',{ascending:false})]);
  if(bg&&(ops>0||e!==epoch))return false;
  players=Object.fromEntries(need(p).map(x=>[x.id,x]));
  priv=Object.fromEntries(need(pp).map(x=>[x.player_id,x]));
  sessions=need(s);
  if(!cur||!curS()) cur=(sessions.find(x=>x.status==='live')||sessions.find(x=>x.status==='planned')||sessions[0]||{}).id||null;
  return await loadSession(bg);
}
async function loadSession(bg){
  if(!cur){roster={};courts=[];matches=[];return true;}
  const e=epoch;
  const [r,c,m]=await Promise.all([sb.from('session_players').select('*').eq('session_id',cur),
    sb.from('courts').select('*').eq('session_id',cur).order('id'),
    sb.from('matches').select('*').eq('session_id',cur).order('created_at',{ascending:false})]);
  if(bg&&(ops>0||e!==epoch))return false;
  roster=Object.fromEntries(need(r).map(x=>[x.player_id,x]));courts=need(c);matches=need(m);
  backupLocal();return true;
}

/* ---------- live sync ---------- */
function debounce(f,t){let h;return()=>{clearTimeout(h);h=setTimeout(f,t);};}
const refresh=debounce(async()=>{
  if(ops>0){refresh();return;}                       // an action is running — wait for it to finish
  try{const ok=await loadAll(true);
    if(ok===false){refresh();return;}                // overlapped an action — try again
    if(saveState.s==='err')setSave('ok');safeRender();}catch(e){console.error(e);}},400);
function subscribe(){
  if(channel)return;
  channel=sb.channel('aspc-admin')
    .on('postgres_changes',{event:'*',schema:'public',table:'session_players'},refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'courts'},refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'matches'},refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'sessions'},refresh)
    .subscribe(st=>{const el=$('#sync');if(el)el.classList.toggle('off',st!=='SUBSCRIBED');});
}
function safeRender(){const a=document.activeElement;
  if(modal||ending!=null||(a&&a.closest&&a.closest('#app')&&/INPUT|SELECT/.test(a.tagName)&&a.type!=='checkbox'))return;render();}
setInterval(()=>{if(user&&cur&&navigator.onLine)refresh();},20000);

/* ================= QUEUE + STATS ================= */
/* Anyone sitting on a real court is never listed as waiting, and is never
   suggested or auto-assigned again — even if their status hasn't caught up. */
function queueOf(g){
  const live=new Set(courts.filter(c=>!isPrep(c)).flatMap(slots).filter(Boolean));
  return Object.values(roster).filter(e=>e.status==='queued'&&inGroup(e.player_id,g)&&!live.has(e.player_id))
    .sort((a,b)=>ms(a.queue_ticket)-ms(b.queue_ticket)||a.player_id.localeCompare(b.player_id)).map(e=>e.player_id);}
/* waiting players who are NOT already lined up on a prep court */
function avail(g){const L=linedMap();return queueOf(g).filter(id=>!L[id]);}
function stats(){const s={},g=id=>s[id]||(s[id]={w:0,l:0,last:0});
  matches.forEach(m=>{const aw=m.score1>m.score2,t=ms(m.created_at);
    (m.team1||[]).forEach(id=>{const x=g(id);aw?x.w++:x.l++;x.last=Math.max(x.last,t)});
    (m.team2||[]).forEach(id=>{const x=g(id);aw?x.l++:x.w++;x.last=Math.max(x.last,t)});});return s;}
const pk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function history(){const p={},o={};matches.forEach(m=>{const A=m.team1||[],B=m.team2||[];
  [A,B].forEach(T=>{if(T.length===2)p[pk(T[0],T[1])]=(p[pk(T[0],T[1])]||0)+1;});
  A.forEach(x=>B.forEach(y=>{o[pk(x,y)]=(o[pk(x,y)]||0)+1;}));});return {p,o};}

/* ================= MATCHMAKING ================= */
const PAIRS=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
const teamsOf=(f,p)=>[[f[p[0][0]],f[p[0][1]]],[f[p[1][0]],f[p[1][1]]]];
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function rating(id){const d=dupr(id);if(d)return d;
  const ds=Object.keys(players).filter(x=>players[x].division===P(id).division&&dupr(x)).map(dupr);
  return ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:3;}
const wr=id=>{const x=ST[id];return x&&(x.w+x.l)?x.w/(x.w+x.l):.5;};
function repeatCost(t,H){const [a,b]=t;
  return (H.p[pk(a[0],a[1])]||0)*3+(H.p[pk(b[0],b[1])]||0)*3+a.reduce((s,x)=>s+b.reduce((u,y)=>u+(H.o[pk(x,y)]||0),0),0);}
function bestPairing(f,cost){let best=null,bc=Infinity;PAIRS.forEach(p=>{const t=teamsOf(f,p),c=cost(t);if(c<bc-1e-9){bc=c;best=t;}});return {teams:best,cost:bc};}
function suggest(q,m=mode()){
  if(q.length<4||m==='manual')return null;
  if(m==='rotation')return teamsOf(q.slice(0,4),PAIRS[2]);
  if(m==='balanced')return bestPairing(q.slice(0,4),t=>Math.abs(sum(t[0],rating)-sum(t[1],rating))).teams;
  const H=history(),W=q.slice(0,8),first=W[0];let best=null,bs=Infinity;
  for(let i=1;i<W.length;i++)for(let j=i+1;j<W.length;j++)for(let l=j+1;l<W.length;l++){
    const f=[first,W[i],W[j],W[l]],idx=i+j+l;let sc,t;
    if(m==='roundrobin'){const b=bestPairing(f,t=>repeatCost(t,H)+Math.abs(sum(t[0],rating)-sum(t[1],rating))*.3);t=b.teams;sc=b.cost*4+idx*.5;}
    else{const ws=f.map(wr);const b=bestPairing(f,t=>Math.abs(sum(t[0],wr)-sum(t[1],wr)));t=b.teams;sc=(Math.max(...ws)-Math.min(...ws))*20+idx*.5;}
    if(sc<bs){bs=sc;best=t;}}
  return best;}
function suggestionsFor(g){const q=avail(g),s1=suggest(q);
  const s2=s1?suggest(q.filter(id=>!s1.flat().includes(id))):null;return [s1,s2];}

/* ================= COURT ACTIONS ================= */
async function upd(pid,patch){Object.assign(roster[pid],patch);
  need(await sb.from('session_players').update(patch).eq('session_id',cur).eq('player_id',pid));}
async function setStatus(ids,status){ids=ids.filter(Boolean);if(!ids.length)return;
  ids.forEach(id=>{if(roster[id])roster[id].status=status;});
  need(await sb.from('session_players').update({status}).eq('session_id',cur).in('player_id',ids));}
/* Saves a court's four spots. On a REAL court the timer starts by itself the
   moment all four spots are filled. Prep courts never run a timer.       */
async function writeSlots(c,s){
  const wasFull=filled(c)===4,isFull=s.every(Boolean),isEmpty=s.every(x=>!x);
  let started=c.started_at||null,paused=c.paused_at||null;
  if(isPrep(c)||!isFull){started=null;paused=null;}else if(!wasFull||!started){started=new Date().toISOString();paused=null;}
  const patch={team_a:isEmpty?[]:[s[0],s[1]],team_b:isEmpty?[]:[s[2],s[3]],started_at:started,paused_at:paused};
  Object.assign(c,patch);need(await sb.from('courts').update(patch).eq('id',c.id));}
/* LAST CHECK before anyone goes on a REAL court: ask the database (not this
   screen) whether that court is unchanged and none of these players is already
   on another court. This stops double-booking when two organisers use the admin
   page at the same time. Prep courts are planning only, so they skip the check. */
async function stillFree(c,ids){
  if(isPrep(c))return;
  const all=need(await sb.from('courts').select('*').eq('session_id',cur));
  const me=all.find(x=>x.id===c.id);
  const taken=new Set(all.filter(x=>!x.standby&&x.id!==c.id).flatMap(x=>slots(x)).filter(Boolean));
  if(!me||slots(me).join('|')!==slots(c).join('|')||ids.filter(Boolean).some(id=>taken.has(id)))
    throw new Error('that court or player was just changed on another device. The screen is now up to date — please try again.');
}
async function seat(c,teams){const four=teams.flat();await stillFree(c,four);await setStatus(four,statusFor(c));await writeSlots(c,four);}
/* Move a lined-up prep match onto a real court (timer starts). */
async function sendPrep(p,c){const four=slots(p);await stillFree(c,four);
  await setStatus(four,'court');await writeSlots(c,four);await writeSlots(p,['','','','']);}
async function fillCourt(c){
  if(!isOn(c)&&!isPrep(c))return false;
  const q=avail(c.division),s=slots(c),n=filled(c);
  if(!n){
    if(!isPrep(c)){const pl=lastPlan[c.id],pp=pl&&pl.prep?courtById(pl.prep):null;
      const fp=(pp&&filled(pp)===4)?pp:fullPreps(c.division)[0];
      if(fp){await sendPrep(fp,c);return true;}}
    let t=lastPlan[c.id]&&lastPlan[c.id].teams;
    if(!t||!t.flat().every(id=>q.includes(id)))t=suggest(q,mode()==='manual'?'rotation':mode());
    if(!t)return false;await seat(c,t);return true;}
  let k=0;const add=[];const ns=s.map(x=>x||(q[k]?(add.push(q[k]),q[k++]):''));
  if(!add.length)return false;await stillFree(c,add);await setStatus(add,statusFor(c));await writeSlots(c,ns);return true;}
async function autoFillAll(){if(!autoFill||mode()==='manual')return;
  for(const c of courts)if(isOn(c)&&!filled(c))await fillCourt(c);}
async function clearCourt(c){await setStatus(slots(c),'queued');await writeSlots(c,['','','','']);}
async function endMatch(c,scores){
  const s=slots(c),A=[s[0],s[1]],B=[s[2],s[3]];let W=A,L=B;
  if(scores){const [s1,s2]=scores;if(s2>s1){W=B;L=A;}
    const game=Math.max(0,...matches.filter(m=>m.division===c.division).map(m=>m.game||0))+1;
    need(await sb.from('matches').insert({session_id:cur,session_date:curS().session_date,division:c.division,game,
      court:c.label,team1:A,team2:B,score1:s1,score2:s2}));}
  const now=Date.now();   // winners go back in line first
  await Promise.all([...W,...L].map((id,i)=>roster[id]?upd(id,{status:'queued',games_played:(roster[id].games_played||0)+1,
    queue_ticket:new Date(now+i).toISOString()}):null));
  await writeSlots(c,['','','','']);ending=null;
  await loadSession();ST=stats();await autoFillAll();}
async function swapTickets(x,y){ // x is ahead of y; afterwards y is ahead of x
  const tx=roster[x].queue_ticket,ty=roster[y].queue_ticket;
  let nx=ty,ny=tx;if(ms(tx)===ms(ty))ny=new Date(ms(tx)-1).toISOString();
  await Promise.all([upd(x,{queue_ticket:nx}),upd(y,{queue_ticket:ny})]);}
/* take someone off any prep court they're lined up on */
async function unlinePrep(id){const lp=linedMap()[id];if(lp){const s=slots(lp);s[s.indexOf(id)]='';await writeSlots(lp,s);}}

/* ---- tap-to-swap ----
   Tap a player (on a court, a prep court or waiting), then tap:
   • another court spot → they swap (same court, other team, another court or prep court)
   • an empty spot      → they move there
   • someone waiting    → the waiting player replaces them                 */
const same=(a,b)=>a.k===b.k&&(a.k==='w'?a.id===b.id:String(a.c)===String(b.c)&&a.i===b.i);
async function pickTarget(t){
  if(ending!=null)return;
  if(t.k==='w'){const L=linedMap();if(L[t.id]){const c=L[t.id];t={k:'s',c:String(c.id),i:slots(c).indexOf(t.id)};}}
  if(!sel){sel=t;render();return;}
  if(same(sel,t)){sel=null;render();return;}
  const a=sel;sel=null;await doSwap(a,t);render();}
async function doSwap(a,b){
  if(a.k==='w'&&b.k==='w'){const q=queueOf(groupOf(a.id));const [x,y]=q.indexOf(a.id)<q.indexOf(b.id)?[a.id,b.id]:[b.id,a.id];
    await swapTickets(x,y);toast(`${P(a.id).name} and ${P(b.id).name} swapped places`);return;}
  if(a.k==='w')[a,b]=[b,a];
  if(b.k==='w'){const c=courtById(a.c);await stillFree(c,[b.id]);const s=slots(c),old=s[a.i];s[a.i]=b.id;
    await setStatus([b.id],statusFor(c));if(old)await setStatus([old],'queued');await writeSlots(c,s);
    toast(old?`${P(b.id).name} in for ${P(old).name}`:`${P(b.id).name} on ${c.label}`);return;}
  const ca=courtById(a.c),cb=courtById(b.c);
  if(ca===cb){const s=slots(ca);[s[a.i],s[b.i]]=[s[b.i],s[a.i]];await writeSlots(ca,s);}
  else{const sa=slots(ca),sc=slots(cb);[sa[a.i],sc[b.i]]=[sc[b.i],sa[a.i]];
    await writeSlots(ca,sa);await writeSlots(cb,sc);
    if(sa[a.i])await setStatus([sa[a.i]],statusFor(ca));
    if(sc[b.i])await setStatus([sc[b.i]],statusFor(cb));}
  toast('Swapped');}

function groupBlock(g){
  const cs=courts.filter(c=>c.division===g),on=cs.filter(isOn),off=cs.filter(c=>!isOn(c)&&!isPrep(c)),preps=cs.filter(isPrep);
  const q=queueOf(g),sugs=suggestionsFor(g),full=preps.filter(p=>filled(p)===4),tv=tvSet();
  const exp=Object.values(roster).filter(e=>e.status==='expected'&&inGroup(e.player_id,g)).length;
  let pi=0,fi=0;lastPlan={...lastPlan};
  const cards=on.map(c=>{let plan=null;
    if(!filled(c)){if(full[pi])plan={prep:full[pi++].id};else if(sugs[fi])plan={teams:sugs[fi++]};lastPlan[c.id]=plan;}
    return courtCard(c,plan,tv);}).join('');
  const playing=on.filter(c=>filled(c)===4).length,room=preps.length<MAX_PREP;
  return `<div class="adiv"><div class="adiv-head"><h2>${g==='social'?'Social play':DIVS[g]}</h2>

    <div class="courts">${cards||`<p class="dim">No ${g==='social'?'':DIVS[g]+' '}courts right now.${isSocial()?' Turn one on in ⚙ Courts.':' Tap ⇄ on a free court in the other section to move it here.'}</p>`}</div>
    ${off.length?`<div class="offrow"><span class="dim">Inactive:</span>${off.map(c=>`<button class="btn quiet sm" data-act="courtOn" data-id="${c.id}">${esc(c.label)} · Turn on</button>`).join('')}</div>`:''}

    ${preps.length?`<div class="courts">${preps.map(p=>prepCard(p,g)).join('')}</div>`
      :`<p class="prep-hint dim">Add a prep court to plan the next ${g==='social'?'':DIVS[g]+' '}match while games are still being played. Players stay in the waiting list until you send them to a real court.</p>`}
    ${waitingBox(g,sugs)}</div>`;
}
/* the four player spots — used by real courts and prep courts */

    :`<button class="slot empty ${isSel(i)?'sel':''}" data-act="slot" data-c="${c.id}" data-i="${i}">+ Add player</button>`;
  const team=(i0,side)=>`<div class="team ${side}">${slot(i0)}${slot(i0+1)}${withScores?`<input class="score-in" type="number" min="0" inputmode="numeric" id="sc${side}-${c.id}" placeholder="0" aria-label="Score">`:''}</div>`;

function courtCard(c,plan,tv){

  const ctl=isFull&&!ed?(!c.started_at?btn('tstart','▶ Start')
    :(c.paused_at?btn('tresume','▶ Resume'):btn('tpause','⏸ Pause'))+btn('trestart','↺','Restart the timer')):'';

  else if(n) foot=`<div class="ac-act"><button class="btn" data-act="fillQ" data-id="${c.id}" ${avail(c.division).length>=4-n?'':'disabled'}>Fill from queue</button>

  else foot=`<div class="free-msg">${mode()==='manual'?'Tap “+ Add player”, then tap someone waiting.':`Need ${Math.max(0,4-avail(c.division).length)} more in the queue.`}</div>`;

function prepCard(p,g){

function waitingBox(g,sugs){

    ${sugs[0]?`<div class="upnext">${line(sugs[0],'Next','n1')}${line(sugs[1],'Then','n2')}</div>`:''}
    ${q.length?`<ol class="wl"><li class="wr head"><span>Player</span><span class="wc">GP</span><span class="wc">W–L</span><span class="wc">Wait</span><span class="wc hide-md">Last game</span><span></span></li>
    ${q.map((id,i)=>{const e=roster[id],st=ST[id]||{w:0,l:0,last:0},k=L[id]?-1:grp(id);
      const since=Math.max(ms(e.arrived_at),st.last),mins=since?Math.floor((now-since)/60000):0;
      const isS=sel&&sel.k==='w'&&sel.id===id;
      return `<li class="wr ${L[id]?'lined':k===0?'g1':k===1?'g2':''} ${isS?'sel':''}">
        <button class="wmain" data-act="wait" data-id="${esc(id)}" title="Tap to select, then tap a court spot"><span class="qn">${i+1}</span>${av(id,28)}<b>${esc(P(id).name)}</b>
          ${L[id]?`<span class="chip prep">Lined up</span>`:''}
          ${g==='social'?`<span class="chip ${P(id).division} hide-md">${DIVS[P(id).division].slice(0,3)}</span>`:''}${P(id).organiser?'<span class="chip org">/O</span>':''}</button>
        <span class="wc">${e.games_played||0}</span><span class="wc">${st.w}–${st.l}</span><span class="wc dim">${mins<1?'now':mins+'m'}</span>
        <span class="wc dim hide-md">${st.last?fmtTime(st.last):'—'}</span>
        <span class="qa"><button title="Move up one" data-act="qup" data-id="${esc(id)}" ${i?'':'disabled'}>▲</button><button title="Move down one" data-act="qdown" data-id="${esc(id)}" ${i<q.length-1?'':'disabled'}>▼</button><button title="Play next" data-act="qtop" data-id="${esc(id)}" ${i?'':'disabled'}>⏭</button><button title="Sit out" data-act="qrest" data-id="${esc(id)}">💤</button></span></li>`;}).join('')}</ol>`
      :'<p class="dim" style="margin:0">Nobody waiting.</p>'}
    ${rest.length?`<h3 style="margin-top:1rem">Sitting out</h3><ul class="rest">${rest.map(id=>`<li>${av(id,26)}<b>${esc(P(id).name)}</b>
      <span class="qa"><button class="txt" data-act="qback" data-id="${esc(id)}">Back in line</button><button title="Gone for the night" data-act="qleave" data-id="${esc(id)}">✕</button></span></li>`).join('')}</ul>`:''}
  </div>`;
}

/* ---- Monthly stats ----
   Adds up every game recorded in the database for the chosen month,
   across all sessions (open play and social). Players are grouped by
   their own division. Order: most wins, then win %, then point diff. */
let statMonth=null,statData=[];
const STATS_START='2026-10';   // monthly stats begin here; earlier months are not shown
const statMonths=()=>[...new Set(sessions.map(s=>s.session_date.slice(0,7)))].filter(m=>m>=STATS_START).sort().reverse();
const monthName=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});};
async function loadStats(){
  const months=statMonths();
  if(!statMonth||!months.includes(statMonth))statMonth=months[0]||null;
  const ids=sessions.filter(s=>s.session_date.slice(0,7)===statMonth).map(s=>s.id);
  statData=ids.length?need(await sb.from('matches').select('*').in('session_id',ids)):[];
}
function monthStats(){
  const st={};
  statData.forEach(m=>{const aw=m.score1>m.score2,df=m.score1-m.score2;
    const add=(id,won,d)=>{const g=m.division==='social'?P(id).division:m.division,k=g+'|'+id,x=st[k]||(st[k]={id,g,w:0,l:0,d:0,s:new Set()});won?x.w++:x.l++;x.d+=d;x.s.add(m.session_id);};
    (m.team1||[]).forEach(id=>add(id,aw,df));(m.team2||[]).forEach(id=>add(id,!aw,-df));});
  return Object.values(st).map(x=>({...x,gp:x.w+x.l,wr:x.w/(x.w+x.l)*100,sess:x.s.size}))
    .sort((a,b)=>b.w-a.w||b.gp-a.gp||b.d-a.d||P(a.id).name.localeCompare(P(b.id).name));
}
function statsView(){
  if(!statMonth)return `<div class="empty"><p>No sessions yet.</p></div>`;
  const rows=monthStats(),nS=new Set(statData.map(m=>m.session_id)).size;
  const TH='padding:.55rem .6rem;font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:var(--soft);color:var(--ink);text-align:center;white-space:nowrap';
  const TD='padding:.55rem .6rem;border-top:1px solid var(--line);color:var(--ink);text-align:center;font-variant-numeric:tabular-nums';
  const tbl=g=>{const r=rows.filter(x=>g==='org'?P(x.id).organiser:x.g===g&&!P(x.id).organiser);
    return `<div class="adiv"><div class="adiv-head"><h2>${DIVS[g]}</h2><span class="chip ${g}">${r.length} player${r.length===1?'':'s'}</span></div>
      <div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.86rem">
        <thead><tr>${['#','Player','GP','W','L','Win %','Diff','Sessions'].map((h,i)=>`<th style="${TH}${i===1?';text-align:left':''}">${h}</th>`).join('')}</tr></thead>
        <tbody>${r.map((x,i)=>`<tr><td style="${TD};font-weight:800">${i+1}</td>
          <td style="${TD};text-align:left;font-weight:700">${esc(P(x.id).name)}${P(x.id).organiser?' <span class="chip org">/O</span>':''}</td>
          <td style="${TD}">${x.gp}</td><td style="${TD};font-weight:800">${x.w}</td><td style="${TD}">${x.l}</td>
          <td style="${TD};font-weight:800">${x.wr.toFixed(1)}%</td><td style="${TD}">${x.d>0?'+'+x.d:x.d}</td><td style="${TD}">${x.sess}</td></tr>`).join('')
          ||`<tr><td colspan="8" class="dim" style="padding:1.2rem;text-align:center">No ${DIVS[g]} games recorded this month.</td></tr>`}</tbody></table></div></div>`;};
  return `<div class="sec-head"><div><h2>Monthly stats · ${monthName(statMonth)}</h2>
      <p>${statData.length} game${statData.length===1?'':'s'} across ${nS} session${nS===1?'':'s'}, Each game counts where it was played: Regular games in Regular, Ascend games in Ascend, and social games under the player's own division. Ordered by most wins, then most games played, then point difference. Only organisers can see this.</p></div>
    <div class="tools"><select class="inp sm" data-act="statMonth" aria-label="Month">${statMonths().map(m=>`<option value="${m}" ${m===statMonth?'selected':''}>${monthName(m)}</option>`).join('')}</select>
      <button class="btn sm" data-act="statsCSV">⬇ Download (CSV)</button></div></div>
    ${tbl('regular')}${tbl('ascend')}${rows.some(x=>P(x.id).organiser)?tbl('org'):''}`;
}
function statsCSV(){
  if(!statMonth)return toast('No month selected',true);
  const rows=monthStats(),L=[[`Aftershift Pickleclub — Monthly stats — ${monthName(statMonth)}`],[],['Division','Rank','Player','Games played','Won','Lost','Win %','Point diff','Sessions']];
  ['regular','ascend','org'].forEach(g=>rows.filter(x=>g==='org'?P(x.id).organiser:x.g===g&&!P(x.id).organiser).forEach((x,i)=>
    L.push([DIVS[g],i+1,P(x.id).name,x.gp,x.w,x.l,x.wr.toFixed(1)+'%',x.d,x.sess])));
  download(`aftershift-${statMonth}-monthly-stats.csv`,'\ufeff'+L.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
  toast('Monthly stats downloaded ⬇');
}

function resizeImage(file){return new Promise((res,rej)=>{const img=new Image();
  img.onload=()=>{const s=Math.min(1,800/Math.max(img.width,img.height)),cv=document.createElement('canvas');
    cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(img.src);cv.toBlob(b=>b?res(b):rej(new Error('Could not read that photo')),'image/jpeg',.85);};
  img.onerror=()=>rej(new Error('Could not read that photo — try a JPG or PNG'));img.src=URL.createObjectURL(file);});}

async function savePlayer(id){
  const name=$('#fName').value.trim();if(!name)return toast('Type a name first',true);
  const dv=$('#fDupr').value.trim(),d=dv?parseFloat(dv):null;
  if(d!==null&&(isNaN(d)||d<1||d>8))return toast('DUPR should be between 1.00 and 8.00',true);
  /* DUPLICATE CHECK: warn before the pool ends up with the same name twice.

  const twin=Object.values(players).find(p=>p.id!==id&&sameName(p.name,name));
  if(twin&&!confirm(`A player named "${twin.name}" is already in the pool (${DIVS[twin.division]||twin.division}).\n\n`
      +`If this is the same person, tap Cancel and use the existing player instead — otherwise their games get split between two entries.\n\n`
      +(id?`Save this name anyway?`:`Add a second "${name}" anyway?`))){
    toast(id?'Not saved — that name is already in the pool':`Not added — "${twin.name}" is already in the pool`);return;}
  const division=$('#fDiv').value,organiser=$('#fOrg').checked,addNow=!id&&$('#fAdd')&&$('#fAdd').checked;
  let pid=id;
  if(!id){const base=name.toLowerCase().replace(/[^a-z0-9]+/g,'')||'player';pid=base;let k=2;while(players[pid])pid=base+k++;
    need(await sb.from('players').insert({id:pid,name,division,organiser}));}
  else need(await sb.from('players').update({name,division,organiser}).eq('id',id));
  if(pendingPhoto){const path=`${pid}-${Date.now()}.jpg`;
    need(await sb.storage.from('player-photos').upload(path,pendingPhoto,{contentType:'image/jpeg',upsert:true}));
    const url=sb.storage.from('player-photos').getPublicUrl(path).data.publicUrl;
    need(await sb.from('players').update({photo_url:url}).eq('id',pid));}
  else if(removePhoto)need(await sb.from('players').update({photo_url:null}).eq('id',pid));
  need(await sb.from('player_private').upsert({player_id:pid,dupr:d},{onConflict:'player_id'}));
  if(addNow)need(await sb.from('session_players').insert({session_id:cur,player_id:pid,status:'expected'}));
  const had=!!pendingPhoto;closeModal();await loadAll();render();
  toast(id?name+' updated':name+' added'+(addNow?' to this session':'')+(had?'':' — add a photo any time'));
}

async function createSession(){

  const label=$('#nLabel').value.trim()||wd+(social?' social play':' open play');

  const rows=[];
  if(social){const n=Math.min(MAX_COURTS,Math.max(1,parseInt($('#nCourts').value,10)||1));
    for(let i=1;i<=n;i++)rows.push({label:'Court '+i,division:'social',active:true});}
  else{const nr=Math.max(0,parseInt($('#nReg').value,10)||0),na=Math.max(0,parseInt($('#nAsc').value,10)||0);

    for(let i=1;i<=nr;i++)rows.push({label:'Court '+i,division:'regular',active:true});
    for(let i=1;i<=na;i++)rows.push({label:'Court '+(nr+i),division:'ascend',active:true});}
  const s=need(await sb.from('sessions').insert({session_date:date,label,status:'planned',session_type:newType,match_mode:social?'roundrobin':'rotation',tv_courts:tv}).select().single());

}

const VIEW_ONLY=new Set(['theme','tab','closeModal','newSession','nType','courtsPanel','openCourts','slot','wait','selCancel','end','cancelEnd',

async function act(d,el,e){

  switch(d.act){

    case 'reload': location.reload();break;
    case 'retry': if(saveState.s==='err'||!navigator.onLine){toast('Reloading the latest saved data…');await loadAll();setSave('ok');render();}break;
    case 'exportCSV': exportCSV();break;
    case 'exportJSON': exportJSON();break;
    case 'dlLocalCSV': {const b=readLocal();if(b)exportCSV(b);break;}
    case 'dlLocalJSON': {const b=readLocal();if(b)exportJSON(b);break;}

    case 'statsCSV': statsCSV();break;

    case 'removePrep': {const p=court();
      need(await sb.from('courts').delete().eq('id',p.id));await loadSession();render();toast(p.label+' removed — its players are still waiting');break;}

    case 'tresume': {const c=court(),st=new Date(ms(c.started_at)+(Date.now()-ms(c.paused_at))).toISOString();
      need(await sb.from('courts').update({started_at:st,paused_at:null}).eq('id',c.id));Object.assign(c,{started_at:st,paused_at:null});render();break;}
    case 'end': sel=null;ending=court().id;render();{const f=document.getElementById('sct1-'+d.id);if(f)f.focus();}break;
    case 'cancelEnd': ending=null;render();break;
    case 'saveEnd': {const c=court(),s=readPair($('#sct1-'+c.id).value,$('#sct2-'+c.id).value);if(!s)break;
      await endMatch(c,s);render();toast('Saved ✓ Everyone back in line');break;}
    case 'noScore': {const c=court();await endMatch(c,null);render();toast(c.label+' ended — everyone back in line');break;}
    /* results */

    case 'saveEdit': {const s=readPair($('#sa').value,$('#sb').value);if(!s)break;
      need(await sb.from('matches').update({score1:s[0],score2:s[1]}).eq('id',Number(d.id)));closeModal();await loadSession();render();toast('Score updated');break;}

document.addEventListener('click',async e=>{
  if(e.target.closest('[data-stop]')&&!e.target.closest('[data-act]:not(.backdrop)'))return;
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;
  if(busy&&el.dataset.act!=='closeModal')return;
  const writes=!VIEW_ONLY.has(el.dataset.act)||(el.dataset.act==='slot'||el.dataset.act==='wait')&&sel;
  busy=true;ops++;epoch++;if(writes)setSave('saving');
  try{await act(el.dataset,el,e);if(writes){setSave('ok');backupLocal();}}
  catch(err){fail(err);sel=null;await loadSession().catch(()=>{});render();}
  finally{busy=false;ops--;epoch++;}
});

    if(a==='setArr'&&t.value){const id=t.dataset.id,e2=roster[id],v=onDate(t.value),patch={arrived_at:v};
      if(e2.status==='queued'&&!e2.games_played)patch.queue_ticket=v;
      await upd(id,patch);render();toast(patch.queue_ticket?'Arrival time changed — queue place adjusted':'Arrival time saved');}
    if(t.id==='phFile'&&t.files[0]){pendingPhoto=await resizeImage(t.files[0]);removePhoto=false;
      $('#phWrap').innerHTML=photoPrev(URL.createObjectURL(pendingPhoto));$('#phHint').textContent='Tap to change photo';}
    if(writes){setSave('ok');backupLocal();}
  }catch(err){fail(err);await loadSession().catch(()=>{});render();}
  finally{ops--;epoch++;}
});
document.addEventListener('input',e=>{if(e.target.id==='poolQ'){poolQ=e.target.value;$('#poolGrid').innerHTML=poolGrid();}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(modal)closeModal();else if(ending!=null){ending=null;render();}else if(sel){sel=null;render();}}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('score-in')){e.preventDefault();const b=e.target.closest('.acourt').querySelector('[data-act="saveEnd"]');if(b)b.click();}
  if(e.key==='Enter'&&modal==='edit'){e.preventDefault();$('[data-act="saveEdit"]').click();}
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm')return;e.preventDefault();
  const btn=$('#loginBtn');btn.disabled=true;btn.textContent='Signing in…';
  const {data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){btn.disabled=false;btn.textContent='Sign in';return toast(error.message==='Invalid login credentials'?'Wrong email or password':error.message,true);}
  user=data.user;try{await loadAll();subscribe();}catch(err){fail(err);}render();toast('Welcome back');
});

/* timers tick every second; waiting times refresh every 30s */
setInterval(()=>{courts.forEach(c=>{if(isPrep(c)||filled(c)<4||!c.started_at)return;const r=remaining(c);
  document.querySelectorAll(`[data-timer="${c.id}"]`).forEach(el=>{el.textContent=tText(c);el.classList.toggle('up',r===0);
    const card=el.closest('.acourt');if(card)card.classList.toggle('done',r===0);});});},1000);
setInterval(()=>{if(user&&tab==='rally')safeRender();},30000);

/* start */
(async()=>{
  if(!sb){render();return;}
  try{const {data}=await sb.auth.getSession();user=data.session?.user||null;
    if(user){await loadAll();subscribe();}}
  catch(err){fail(err);}
  render();
})();
</script>
</body>
</html>
