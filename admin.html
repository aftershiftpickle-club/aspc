<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ASPC Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--black:#0A0A0A;--panel:#131313;--panel2:#191919;--edge:#262626;--ink:#F4F5F0;--muted:#8E958A;--volt:#C7D92C;--volt2:#DCF23A;--red:#E2543B;--blue:#7FB0E0;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--black);color:var(--ink);font:400 15px/1.55 "Montserrat",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{width:min(1180px,100% - 2rem);margin-inline:auto}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.dim{color:var(--muted)}
.grow{flex:1}
.loading{text-align:center;color:var(--muted);padding:4rem 1rem}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none;color:inherit}
.ball{width:32px;height:32px;border-radius:50%;flex:none;background:radial-gradient(circle,#0A0A0A 20%,transparent 23%) 2px 2px/10px 10px,var(--volt)}
.brand b{display:block;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.95rem;line-height:1}
.brand small{display:block;color:var(--volt);font-size:.6rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.adm-badge{font-size:.6rem;font-weight:800;letter-spacing:.16em;background:var(--red);color:#fff;border-radius:6px;padding:.2rem .45rem}
.atop{position:sticky;top:0;z-index:40;background:#0E0E0E;border-bottom:1px solid #1E1E1E}
.atop-in{display:flex;align-items:center;gap:.7rem;min-height:60px;flex-wrap:wrap;padding:.4rem 0}
.sync{display:flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:700;color:var(--volt);border:1px solid rgba(199,217,44,.35);border-radius:999px;padding:.28rem .65rem}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--volt);animation:pulse 1.4s infinite}
.sync.off{color:var(--muted);border-color:#333}.sync.off i{background:var(--muted);animation:none}
@keyframes pulse{50%{opacity:.3}}
.atabs{border-bottom:1px solid #1E1E1E;background:#0B0B0B}
.atabs button{border:0;background:none;color:var(--muted);font-weight:700;font-size:.86rem;padding:.85rem 1rem;border-bottom:2px solid transparent;white-space:nowrap}
.atabs button[aria-current="page"]{color:#fff;border-color:var(--volt)}
footer{border-top:1px solid #1E1E1E;padding:1.4rem 0 2.4rem;margin-top:2.5rem;color:var(--muted);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}

.btn{border:0;background:var(--volt);color:#0A0A0A;font-weight:800;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;padding:.62rem 1rem;border-radius:999px;text-decoration:none;display:inline-block}
.btn:hover{background:var(--volt2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.quiet{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px var(--edge)}
.btn.quiet:hover{box-shadow:inset 0 0 0 1.5px var(--volt);color:var(--volt)}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px rgba(226,84,59,.45)}
.btn.sm{padding:.42rem .75rem;font-size:.66rem}
.btn.w{width:100%}
.field{display:grid;gap:.35rem;margin-bottom:.9rem}
.field label{font-size:.66rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.inp{background:#161616;border:1.5px solid #333;border-radius:10px;padding:.62rem .8rem;color:#fff;width:100%;color-scheme:dark}
.inp:focus{border-color:var(--volt);outline:0}
.chk{display:flex;align-items:center;gap:.45rem;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--volt);width:16px;height:16px}
.seg{display:flex;gap:3px;background:#161616;border:1.5px solid var(--edge);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font-weight:700;font-size:.78rem;padding:.42rem .9rem;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--volt);color:#0A0A0A}
.chip{font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:.18rem .55rem;border:1px solid;white-space:nowrap}
.chip.regular{color:var(--volt);border-color:rgba(199,217,44,.4)}
.chip.ascend{color:var(--blue);border-color:rgba(127,176,224,.4)}
.chip.org,.chip.ended,.chip.planned{color:var(--muted);border-color:#333}
.chip.live{color:#fff;background:var(--red);border-color:var(--red)}
.chip.new{color:#0A0A0A;background:#fff;border-color:#fff}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden}
.box{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:1rem}
.box h3{margin:0 0 .75rem;font-size:.7rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--volt)}
.av{--s:36px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#1A1A1A;border:1.5px solid #333;font-family:"Anton",Impact,sans-serif;color:var(--volt);font-size:calc(var(--s)*.4)}
.av.ascend{color:var(--blue)}
.av.ph{background-size:cover;background-position:center;background-color:#222}
.av.big{border:3px solid var(--volt)}

.login{min-height:100vh;display:grid;place-items:center;padding:2rem 1rem;background:radial-gradient(50% 40% at 50% 100%,rgba(199,217,44,.14),transparent 70%)}
.login .card{width:min(400px,100%);padding:2rem;overflow:visible}
.login h1{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:1.8rem;margin:1.2rem 0 .2rem}
.login p{color:var(--muted);margin:0 0 1.3rem;font-size:.88rem}

.sessbar{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:.8rem 1rem;margin-top:1.3rem}
.sessbar .inp{width:auto;max-width:100%}
.rule{margin-top:1rem;border-left:3px solid var(--volt);background:#111;padding:.7rem 1rem;border-radius:0 10px 10px 0;color:#B9BEB2;font-size:.84rem}
.rule b{color:#fff}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:1.6rem 0 1rem}
.sec-head h2{font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:1.5rem;text-transform:uppercase;margin:0}
.sec-head p{margin:.2rem 0 0;color:var(--muted);font-size:.86rem;max-width:62ch}

.adiv{margin-top:1.6rem}
.adiv-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem;flex-wrap:wrap}
.adiv-head h2{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:1.3rem;margin:0}
.linkish{border:0;background:none;color:var(--muted);font-weight:700;font-size:.8rem;margin-left:auto;text-decoration:underline;text-underline-offset:3px}
.linkish:hover{color:var(--volt)}
.agrid{display:grid;grid-template-columns:360px 1fr;gap:1rem;align-items:start}
.aq{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.aq li{display:flex;align-items:center;gap:.5rem;padding:.4rem .5rem;border-radius:10px;background:#0F0F0F;border:1px solid #1e1e1e}
.aq li.up{border-color:rgba(199,217,44,.35)}
.qn{width:22px;height:22px;border-radius:50%;background:#222;color:var(--muted);font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.aq li.up .qn{background:var(--volt);color:#0A0A0A}
.qm{min-width:0;flex:1;line-height:1.2}
.qm b{display:block;font-size:.88rem}
.qm small{color:var(--muted);font-size:.7rem;font-weight:600}
.qa{display:flex;gap:2px}
.qa button{border:0;background:#1b1b1b;color:#bbb;border-radius:6px;min-width:28px;height:28px;font-size:.74rem;padding:0 .3rem}
.qa button:hover:not(:disabled){background:var(--volt);color:#0A0A0A}
.qa button:disabled{opacity:.25;cursor:default}
.qa button.txt{padding:0 .55rem;font-weight:700}
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.acourt{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden}
.acourt.done{border-color:var(--red)}
.acourt.free{border-style:dashed}
.acourt header{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:#0F0F0F;border-bottom:1px solid var(--edge)}
.acourt header b{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:1.05rem}
.timer{font-family:"Anton",Impact,sans-serif;font-size:1.25rem;color:var(--volt);font-variant-numeric:tabular-nums}
.timer.up{color:var(--red)}
.ac-body{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center;padding:1rem;font-weight:700}
.vs{font-family:"Anton",Impact,sans-serif;color:#4a5040}
.tp{display:flex;align-items:center;gap:.45rem;margin:.25rem 0}
.t2 .tp{flex-direction:row-reverse;text-align:right}
.free-msg{padding:1.3rem 1rem;text-align:center;color:var(--muted);font-weight:600}
.ac-act{display:flex;gap:.5rem;padding:0 1rem 1rem}
.ac-act .btn{flex:1}

.tools{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.search{background:#161616;border:1.5px solid #333;border-radius:10px;padding:.55rem .85rem;min-width:220px;color:#fff}
.search:focus{border-color:var(--volt);outline:0}
.stat{font-size:.78rem;color:var(--muted);border:1px solid var(--edge);border-radius:999px;padding:.3rem .7rem;font-weight:600}
.stat b{color:var(--volt)}
.poolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:.85rem;margin-top:1rem}
.pc{position:relative;background:var(--panel);border:1.5px solid var(--edge);border-radius:var(--r);padding:1.2rem .9rem .9rem;display:flex;flex-direction:column;align-items:center;gap:.45rem;text-align:center}
.pc.in{border-color:rgba(199,217,44,.55)}
.pc.out{opacity:.6}
.pc.out:hover{opacity:1}
.pick{position:absolute;top:.6rem;left:.6rem}
.pick input{position:absolute;opacity:0;width:26px;height:26px;margin:0;cursor:pointer}
.pick span{display:block;width:26px;height:26px;border-radius:7px;border:2px solid #444;pointer-events:none}
.pick input:checked+span{background:var(--volt);border-color:var(--volt)}
.pick input:checked+span::after{content:"✓";display:grid;place-items:center;color:#0A0A0A;font-weight:900;height:100%}
.pick input:focus-visible+span{outline:2px solid var(--volt);outline-offset:2px}
.edit{position:absolute;top:.55rem;right:.55rem;border:0;background:none;color:var(--muted);font-size:.72rem;font-weight:700}
.edit:hover{color:var(--volt)}
.pc-photo{border:0;background:none;padding:0;position:relative}
.addph{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);font-style:normal;font-size:.6rem;font-weight:800;background:#fff;color:#0A0A0A;border-radius:999px;padding:.1rem .45rem;white-space:nowrap}
.pc-meta{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center}
.dupr{font-size:.68rem;font-weight:800;border-radius:999px;padding:.18rem .55rem;background:#1f2410;color:var(--volt2)}
.dupr.none{background:#1c1c1c;color:var(--muted)}
.st{font-size:.72rem;font-weight:800;border-radius:6px;padding:.15rem .5rem}
.st.exp{background:#2a2a2a;color:#ddd}.st.q{background:var(--volt);color:#0A0A0A}.st.c{background:#16324a;color:var(--blue)}.st.r{background:#2a1f10;color:#e0a868}
.arr{display:flex;gap:.35rem;align-items:center;width:100%;margin-top:.2rem}
.arr .inp{padding:.4rem .5rem;flex:1;min-width:0}
.lbl2{font-size:.6rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.rrow{display:grid;grid-template-columns:110px 1fr auto 1fr auto;gap:.8rem;align-items:center;padding:.8rem 1rem;border-bottom:1px solid #1e1e1e;font-size:.88rem}
.rrow:last-child{border-bottom:0}
.rrow .sc{font-family:"Anton",Impact,sans-serif;font-size:1.2rem;background:#0D0D0D;border:1px solid var(--edge);border-radius:8px;padding:.1rem .6rem}
.rrow .won{font-weight:700}.rrow .lost{color:var(--muted)}.rrow .b{text-align:right}
.rrow .acts{display:flex;gap:.35rem}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:100;padding:1rem}
.modal{background:var(--panel2);border:1px solid var(--edge);border-radius:16px;width:min(560px,100%);padding:1.4rem;max-height:92vh;overflow:auto}
.modal h2{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;margin:0 0 .2rem}
.modal p{color:var(--muted);margin:0 0 1rem;font-size:.85rem}
.pform{display:grid;grid-template-columns:auto 1fr;gap:1.2rem;align-items:start}
.phpick{display:flex;flex-direction:column;align-items:center;gap:.45rem;cursor:pointer}
.phpick small{color:var(--muted);font-size:.7rem;font-weight:700;text-align:center;max-width:110px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1.1rem}
.sidebox{background:#0F0F0F;border:1.5px solid var(--edge);border-radius:12px;padding:.9rem;text-align:center;font-weight:700}
.sidebox input{margin-top:.6rem;width:74px;text-align:center;font-family:"Anton",Impact,sans-serif;font-size:1.5rem;background:#161616;border:1.5px solid #333;border-radius:10px;padding:.3rem;color:#fff}
.sidebox.win{border-color:var(--volt)}
.mrow{display:flex;justify-content:flex-end;gap:.5rem;align-items:center;margin-top:.4rem}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--volt);color:#0A0A0A;font-weight:800;font-size:.86rem;padding:.75rem 1.1rem;border-radius:12px;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
.toast.err{background:var(--red);color:#fff}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){.agrid{grid-template-columns:1fr}.rrow{grid-template-columns:1fr auto 1fr}.rrow>span:first-child,.rrow .acts{grid-column:1/-1}}
@media(max-width:520px){.pform{grid-template-columns:1fr}.row2{grid-template-columns:1fr}.hide-sm{display:none}}
</style>

<body>
<div id="app"><p class="loading">Loading…</p></div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ====== YOUR SUPABASE PROJECT (safe to be public) ====== */
const SUPABASE_URL = 'https://wczulosdzoewznxlawfj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZPRnMslT6BWplkRvVaiRXA_PUh-bQlO';
const GAME_SECONDS = 600;   // 10-minute games
/* ======================================================= */

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const DIVS = {regular:'Regular', ascend:'Ascend'};

/* ---------- state ---------- */
let user=null, tab='rally', busy=false, channel=null;
let players={}, priv={}, sessions=[], cur=null, roster={}, courts=[], matches=[];
let autoFill=true, balance=true, poolDiv='all', poolShow='all', poolQ='';
let modal=null, pendingPhoto=null, removePhoto=false;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>players[id]||{id,name:id,division:'regular'};
const ini=n=>n.length<=2?n.toUpperCase():n.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join('');
function av(id,s=36,cls=''){const p=P(id);
  return p.photo_url?`<span class="av ph ${cls}" style="--s:${s}px;background-image:url('${esc(p.photo_url)}')"></span>`
                    :`<span class="av ${p.division} ${cls}" style="--s:${s}px">${esc(ini(p.name))}</span>`;}
const names=ids=>(ids||[]).map(id=>esc(P(id).name)).join(' & ');
const ms=t=>t?new Date(t).getTime():0;
const fmtTime=t=>t?new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'—';
const hhmm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
function fmtDate(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
const curS=()=>sessions.find(s=>s.id===cur);
const onDate=t=>new Date(`${curS().session_date}T${t}:00`).toISOString();
const remaining=c=>c.started_at?Math.max(0,GAME_SECONDS-Math.floor((Date.now()-ms(c.started_at))/1000)):GAME_SECONDS;
const dupr=id=>priv[id]&&priv[id].dupr!=null?Number(priv[id].dupr):null;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',err?5000:2800);}
function fail(e){console.error(e);toast('Something went wrong: '+(e?.message||e),true);}
function need(res){if(res.error)throw res.error;return res.data;}

/* ---------- loading ---------- */
async function loadAll(){
  const [p,pp,s]=await Promise.all([
    sb.from('players').select('*').order('name'),
    sb.from('player_private').select('*'),
    sb.from('sessions').select('*').order('session_date',{ascending:false})]);
  players=Object.fromEntries(need(p).map(x=>[x.id,x]));
  priv=Object.fromEntries(need(pp).map(x=>[x.player_id,x]));
  sessions=need(s);
  if(!cur||!curS()) cur=(sessions.find(x=>x.status==='live')||sessions.find(x=>x.status==='planned')||sessions[0]||{}).id||null;
  await loadSession();
}
async function loadSession(){
  if(!cur){roster={};courts=[];matches=[];return;}
  const [r,c,m]=await Promise.all([
    sb.from('session_players').select('*').eq('session_id',cur),
    sb.from('courts').select('*').eq('session_id',cur).order('id'),
    sb.from('matches').select('*').eq('session_id',cur).order('created_at',{ascending:false})]);
  roster=Object.fromEntries(need(r).map(x=>[x.player_id,x]));
  courts=need(c); matches=need(m);
}

/* ---------- live sync between organisers' phones ---------- */
function debounce(f,t){let h;return()=>{clearTimeout(h);h=setTimeout(f,t);};}
const refresh=debounce(async()=>{try{await loadSession();safeRender();}catch(e){console.error(e);}},400);
function subscribe(){
  if(channel) return;
  channel=sb.channel('aspc-admin')
    .on('postgres_changes',{event:'*',schema:'public',table:'session_players'},refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'courts'},refresh)
    .subscribe(st=>{const el=$('#sync');if(el)el.classList.toggle('off',st!=='SUBSCRIBED');});
}
function safeRender(){const a=document.activeElement;
  if(modal||(a&&a.closest&&a.closest('#app')&&/INPUT|SELECT/.test(a.tagName)&&a.type!=='checkbox'))return;render();}
setInterval(()=>{if(user&&cur)refresh();},20000);

/* ================= QUEUE LOGIC =================
   Each waiting player holds a "paddle-down" time (queue_ticket):
   arrival time for their first game, then the time their last game ended.
   Earliest time plays next.                                          */
function queueOf(div){
  return Object.values(roster).filter(e=>e.status==='queued'&&P(e.player_id).division===div)
    .sort((a,b)=>ms(a.queue_ticket)-ms(b.queue_ticket)||a.player_id.localeCompare(b.player_id)).map(e=>e.player_id);}
function rating(id){const d=dupr(id);if(d)return d;
  const ds=Object.keys(players).filter(x=>players[x].division===P(id).division&&dupr(x)).map(dupr);
  return ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:3;}
function pair(four){if(!balance)return [[four[0],four[3]],[four[1],four[2]]];
  const s=[...four].sort((a,b)=>rating(b)-rating(a));return [[s[0],s[3]],[s[1],s[2]]];}
const courtOf=id=>(courts.find(c=>(c.team_a||[]).includes(id)||(c.team_b||[]).includes(id))||{}).label||'court';
async function upd(pid,patch){Object.assign(roster[pid],patch);
  need(await sb.from('session_players').update(patch).eq('session_id',cur).eq('player_id',pid));}
async function fillCourt(c){
  const q=queueOf(c.division);if(q.length<4)return false;
  const four=q.slice(0,4),[a,b]=pair(four),started=new Date().toISOString();
  four.forEach(id=>roster[id].status='court');
  Object.assign(c,{team_a:a,team_b:b,started_at:started});
  need(await sb.from('session_players').update({status:'court'}).eq('session_id',cur).in('player_id',four));
  need(await sb.from('courts').update({team_a:a,team_b:b,started_at:started}).eq('id',c.id));
  return true;}
async function autoFillAll(){if(!autoFill)return;for(const c of courts)if(!(c.team_a||[]).length)await fillCourt(c);}
async function undoCourt(c){
  const four=[...(c.team_a||[]),...(c.team_b||[])];
  four.forEach(id=>{if(roster[id])roster[id].status='queued';});   // their old paddle-down times are untouched
  need(await sb.from('session_players').update({status:'queued'}).eq('session_id',cur).in('player_id',four));
  need(await sb.from('courts').update({team_a:[],team_b:[],started_at:null}).eq('id',c.id));
  Object.assign(c,{team_a:[],team_b:[],started_at:null});}
async function swap(x,y){ // x is ahead of y; afterwards y is ahead of x
  const tx=roster[x].queue_ticket,ty=roster[y].queue_ticket;
  let nx=ty,ny=tx; if(ms(tx)===ms(ty)) ny=new Date(ms(tx)-1).toISOString();
  await Promise.all([upd(x,{queue_ticket:nx}),upd(y,{queue_ticket:ny})]);}
async function recordResult(c,s1,s2){
  const aWon=s1>s2,W=aWon?c.team_a:c.team_b,L=aWon?c.team_b:c.team_a;
  const game=matches.filter(m=>m.division===c.division).length+1;
  need(await sb.from('matches').insert({session_id:cur,session_date:curS().session_date,division:c.division,game,
    court:c.label,team1:c.team_a,team2:c.team_b,score1:s1,score2:s2}));
  const now=Date.now();
  await Promise.all([...W,...L].map((id,i)=>roster[id]?upd(id,{status:'queued',games_played:(roster[id].games_played||0)+1,
    queue_ticket:new Date(now+i).toISOString()}):null));
  need(await sb.from('courts').update({team_a:[],team_b:[],started_at:null}).eq('id',c.id));
  Object.assign(c,{team_a:[],team_b:[],started_at:null});
  await autoFillAll();
}

function rallyView(){

  return `<div class="rule"><b>How the order works:</b> everyone holds a “paddle-down” time — when they arrived, or when their last game ended. Earliest time plays next, so late arrivals never jump the line.

}
function rallyBlock(d){
  const q=queueOf(d),cs=courts.filter(c=>c.division===d);
  const rest=Object.values(roster).filter(e=>e.status==='resting'&&P(e.player_id).division===d).map(e=>e.player_id);
  const exp=Object.values(roster).filter(e=>e.status==='expected'&&P(e.player_id).division===d).length;
  const g=n=>(n||0)+' game'+(n===1?'':'s');
  return `<div class="adiv"><div class="adiv-head"><h2>${DIVS[d]}</h2><span class="chip ${d}">${q.length} waiting</span>
    ${exp?`<button class="linkish" data-act="tab" data-tab="pool">${exp} registered, not arrived yet →</button>`:''}</div>
  <div class="agrid"><div class="box"><h3>Queue</h3><ol class="aq">
    ${q.map((id,i)=>`<li class="${i<4?'up':''}"><span class="qn">${i+1}</span>${av(id,28)}
      <div class="qm"><b>${esc(P(id).name)}${P(id).organiser?' <span class="chip org">/O</span>':''}</b><small>${g(roster[id].games_played)} · in line since ${fmtTime(roster[id].queue_ticket)}</small></div>
      <span class="qa"><button title="Move up one" data-act="qup" data-id="${id}" ${i?'':'disabled'}>▲</button><button title="Move down one" data-act="qdown" data-id="${id}" ${i<q.length-1?'':'disabled'}>▼</button><button title="Play next" data-act="qtop" data-id="${id}" ${i?'':'disabled'}>⏭</button><button title="Sit out" data-act="qrest" data-id="${id}">💤</button></span></li>`).join('')||'<li class="dim">Nobody waiting</li>'}
  </ol>
  ${rest.length?`<h3 style="margin-top:1rem">Sitting out</h3><ul class="aq">${rest.map(id=>`<li>${av(id,28)}<div class="qm"><b>${esc(P(id).name)}</b><small>${g(roster[id].games_played)}</small></div>
    <span class="qa"><button class="txt" data-act="qback" data-id="${id}">Back in line</button><button title="Gone for the night" data-act="qleave" data-id="${id}">✕</button></span></li>`).join('')}</ul>`:''}
  </div><div class="courts">${cs.map(courtCard).join('')||'<p class="dim">No courts for this division in this session.</p>'}</div></div></div>`;
}
function courtCard(c){

function resizeImage(file){return new Promise((res,rej)=>{const img=new Image();
  img.onload=()=>{const s=Math.min(1,800/Math.max(img.width,img.height)),cv=document.createElement('canvas');
    cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(img.src);cv.toBlob(b=>b?res(b):rej(new Error('Could not read that photo')),'image/jpeg',.85);};
  img.onerror=()=>rej(new Error('Could not read that photo — try a JPG or PNG'));img.src=URL.createObjectURL(file);});}
async function savePlayer(id){
  const name=$('#fName').value.trim();if(!name)return toast('Type a name first',true);
  const dv=$('#fDupr').value.trim(),d=dv?parseFloat(dv):null;
  if(d!==null&&(isNaN(d)||d<1||d>8))return toast('DUPR should be between 1.00 and 8.00',true);
  const division=$('#fDiv').value,organiser=$('#fOrg').checked,addNow=!id&&$('#fAdd')&&$('#fAdd').checked;
  let pid=id;
  if(!id){const base=name.toLowerCase().replace(/[^a-z0-9]+/g,'')||'player';pid=base;let k=2;while(players[pid])pid=base+k++;
    need(await sb.from('players').insert({id:pid,name,division,organiser}));}
  else need(await sb.from('players').update({name,division,organiser}).eq('id',id));
  if(pendingPhoto){const path=`${pid}-${Date.now()}.jpg`;
    need(await sb.storage.from('player-photos').upload(path,pendingPhoto,{contentType:'image/jpeg',upsert:true}));
    const url=sb.storage.from('player-photos').getPublicUrl(path).data.publicUrl;
    need(await sb.from('players').update({photo_url:url}).eq('id',pid));}
  else if(removePhoto) need(await sb.from('players').update({photo_url:null}).eq('id',pid));
  need(await sb.from('player_private').upsert({player_id:pid,dupr:d},{onConflict:'player_id'}));
  if(addNow) need(await sb.from('session_players').insert({session_id:cur,player_id:pid,status:'expected'}));
  closeModal();await loadAll();render();
  toast(id?name+' updated':name+' added'+(addNow?' to this session':'')+(pendingPhoto?'':' — add a photo any time'));
}

async function createSession(){
  const date=$('#nDate').value;if(!date)return toast('Pick a date',true);
  const [y,m,d]=date.split('-').map(Number),wd=new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long'});
  const label=$('#nLabel').value.trim()||wd+' open play',nr=Math.max(0,parseInt($('#nReg').value,10)||0),na=Math.max(0,parseInt($('#nAsc').value,10)||0);
  const s=need(await sb.from('sessions').insert({session_date:date,label,status:'planned'}).select().single());
  const rows=[];for(let i=1;i<=nr;i++)rows.push({session_id:s.id,label:'Court '+i,division:'regular'});
  for(let i=1;i<=na;i++)rows.push({session_id:s.id,label:na===1?'Ascend Court':'Ascend Court '+i,division:'ascend'});
  if(rows.length)need(await sb.from('courts').insert(rows));
  cur=s.id;closeModal();await loadAll();tab='pool';render();toast(label+' created — now tick who is playing');
}
async function copyLast(){
  const s=curS(),prev=sessions.filter(x=>x.session_date<s.session_date).sort((a,b)=>b.session_date.localeCompare(a.session_date))[0];
  if(!prev)return toast('No earlier session to copy from',true);
  let ids=need(await sb.from('session_players').select('player_id').eq('session_id',prev.id)).map(x=>x.player_id);
  if(!ids.length)ids=[...new Set(need(await sb.from('matches').select('team1,team2').eq('session_id',prev.id)).flatMap(x=>[...x.team1,...x.team2]))];
  const add=ids.filter(id=>!roster[id]&&players[id]);
  if(!add.length)return toast('Everyone from '+fmtDate(prev.session_date)+' is already in');
  need(await sb.from('session_players').insert(add.map(id=>({session_id:cur,player_id:id,status:'expected'}))));
  await loadSession();render();toast(add.length+' players copied from '+fmtDate(prev.session_date));
}
async function poolToggle(id,on){
  const e=roster[id];
  if(on){const row={session_id:cur,player_id:id,status:'expected',arrived_at:null,queue_ticket:null};
    need(await sb.from('session_players').upsert(row,{onConflict:'session_id,player_id'}));
    roster[id]={games_played:0,...(e||{}),...row};toast(P(id).name+' added — tap “Arrived” when they check in');}
  else{if(e&&e.status==='court'){render();return toast(P(id).name+' is on court — record or undo that game first',true);}
    if(e&&e.games_played>0)await upd(id,{status:'left'});
    else{need(await sb.from('session_players').delete().eq('session_id',cur).eq('player_id',id));delete roster[id];}
    toast(P(id).name+' taken out of this session');}
  render();
}

/* ================= EVENTS ================= */
async function act(d,el,e){
  const q=d.id&&players[d.id]?queueOf(P(d.id).division):[],i=q.indexOf(d.id);
  const court=()=>courts.find(c=>String(c.id)===d.id);
  switch(d.act){
    case 'tab': tab=d.tab;render();scrollTo(0,0);break;
    case 'signout': await sb.auth.signOut();if(channel){sb.removeChannel(channel);channel=null;}user=null;render();break;
    case 'closeModal': if(e.target===el||el.tagName==='BUTTON')closeModal();break;
    case 'newSession': openNewSession();break;
    case 'createSession': await createSession();break;
    case 'goLive':
      need(await sb.from('sessions').update({status:'ended'}).eq('status','live').neq('id',cur));
      need(await sb.from('sessions').update({status:'live'}).eq('id',cur));
      await loadAll();render();toast('Live! The TV and website now show this session');break;
    case 'endSession':
      if(!confirm('End this session? Results are saved as a draft — check them in the Results tab, then tap Publish.'))break;
      need(await sb.from('sessions').update({status:'ended'}).eq('id',cur));await loadAll();tab='results';render();scrollTo(0,0);
      toast('Session ended — check the scores, then tap 📣 Publish results');break;
    case 'publish':
      if(!confirm('Publish these results? The podium and standings on the website will update for everyone.'))break;
      need(await sb.from('sessions').update({published:true}).eq('id',cur));await loadAll();render();toast('Published ✓ The website now shows this session');break;
    case 'unpublish':
      if(!confirm('Hide these results from the website? Nothing is deleted — you can publish again any time.'))break;
      need(await sb.from('sessions').update({published:false}).eq('id',cur));await loadAll();render();toast('Hidden from the website — nothing deleted');break;
    case 'fill': await fillCourt(court());render();break;
    case 'undo': await undoCourt(court());render();toast('Game undone — those four are back in their old places');break;
    case 'record': openScore('record',Number(d.id));break;
    case 'editRes': openScore('edit',Number(d.id));break;
    case 'saveScore': {const s=readScores();if(!s)break;
      if(d.kind==='record'){const c=courts.find(x=>x.id===Number(d.id));await recordResult(c,s[0],s[1]);closeModal();await loadSession();render();toast('Saved ✓ Website updated');}
      else{need(await sb.from('matches').update({score1:s[0],score2:s[1]}).eq('id',Number(d.id)));closeModal();await loadSession();render();toast('Score updated');}
      break;}
    case 'delRes': if(!confirm('Delete this game? It will disappear from the standings.'))break;
      need(await sb.from('matches').delete().eq('id',Number(d.id)));await loadSession();render();toast('Game deleted');break;
    case 'qup': if(i>0){await swap(q[i-1],d.id);render();}break;
    case 'qdown': if(i>-1&&i<q.length-1){await swap(d.id,q[i+1]);render();}break;
    case 'qtop': if(i>0){await upd(d.id,{queue_ticket:new Date(ms(roster[q[0]].queue_ticket)-1).toISOString()});render();toast(P(d.id).name+' plays next — everyone else keeps their order');}break;
    case 'qrest': await upd(d.id,{status:'resting'});render();toast(P(d.id).name+' is sitting out');break;
    case 'qback': await upd(d.id,{status:'queued',queue_ticket:new Date().toISOString()});await autoFillAll();render();toast(P(d.id).name+' is back — joins the end of the line');break;
    case 'qleave': await upd(d.id,{status:'left'});render();toast(P(d.id).name+' has left for the night');break;
    case 'poolAdd': await poolToggle(d.id,true);break;
    case 'arrive': {const v=($('#arr-'+d.id)||{}).value,t=v?onDate(v):new Date().toISOString();
      await upd(d.id,{status:'queued',arrived_at:t,queue_ticket:t});await autoFillAll();render();
      toast(P(d.id).name+' checked in at '+fmtTime(t)+' — now on the TV');break;}
    case 'poolDiv': poolDiv=d.v;render();break;
    case 'poolShow': poolShow=d.v;render();break;
    case 'copyLast': await copyLast();break;
    case 'newPlayer': openPlayer(null);break;
    case 'editPlayer': openPlayer(d.id);break;
    case 'savePlayer': await savePlayer(d.id);break;
    case 'rmPhoto': pendingPhoto=null;removePhoto=true;$('#phWrap').innerHTML=photoPrev('',$('#fName').value);$('#phHint').textContent='Tap to add photo';el.remove();break;
  }
}
document.addEventListener('click',async e=>{
  if(e.target.closest('[data-stop]')&&!e.target.closest('[data-act]:not(.backdrop)'))return;
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;
  if(busy&&el.dataset.act!=='closeModal')return;
  busy=true;try{await act(el.dataset,el,e);}catch(err){fail(err);await loadSession().catch(()=>{});render();}finally{busy=false;}
});
document.addEventListener('change',async e=>{
  const t=e.target,a=t.dataset.act;
  try{
    if(a==='poolToggle')await poolToggle(t.dataset.id,t.checked);
    if(a==='autoFill'){autoFill=t.checked;await autoFillAll();render();}
    if(a==='balance'){balance=t.checked;toast(balance?'Teams balanced by DUPR':'Teams follow queue order (1+4 vs 2+3)');}
    if(a==='pickSession'){cur=Number(t.value);await loadSession();render();}
    if(a==='setArr'&&t.value){const id=t.dataset.id,e2=roster[id],v=onDate(t.value),patch={arrived_at:v};
      if(e2.status==='queued'&&!e2.games_played)patch.queue_ticket=v;
      await upd(id,patch);render();toast(patch.queue_ticket?'Arrival time changed — queue place adjusted':'Arrival time saved');}
    if(t.id==='phFile'&&t.files[0]){pendingPhoto=await resizeImage(t.files[0]);removePhoto=false;
      $('#phWrap').innerHTML=photoPrev(URL.createObjectURL(pendingPhoto));$('#phHint').textContent='Tap to change photo';}
  }catch(err){fail(err);await loadSession().catch(()=>{});render();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='poolQ'){poolQ=e.target.value;$('#poolGrid').innerHTML=poolGrid();}
  if(e.target.id==='sa'||e.target.id==='sb'){const a=parseInt($('#sa').value,10),b=parseInt($('#sb').value,10);
    $('#sbA').classList.toggle('win',!isNaN(a)&&!isNaN(b)&&a>b);$('#sbB').classList.toggle('win',!isNaN(a)&&!isNaN(b)&&b>a);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modal)closeModal();
  if(e.key==='Enter'&&(modal==='record'||modal==='edit')){e.preventDefault();$('[data-act="saveScore"]').click();}
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm')return;e.preventDefault();
  const btn=$('#loginBtn');btn.disabled=true;btn.textContent='Signing in…';
  const {data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){btn.disabled=false;btn.textContent='Sign in';return toast(error.message==='Invalid login credentials'?'Wrong email or password':error.message,true);}
  user=data.user;try{await loadAll();subscribe();}catch(err){fail(err);}render();toast('Welcome back');
});

/* timers tick every second */
setInterval(()=>{courts.forEach(c=>{if(!(c.team_a||[]).length)return;const r=remaining(c);
  document.querySelectorAll(`[data-timer="${c.id}"]`).forEach(el=>{el.textContent=r===0?"TIME'S UP":fmt(r);el.classList.toggle('up',r===0);
    const card=el.closest('.acourt');if(card)card.classList.toggle('done',r===0);});});},1000);

/* start */
(async()=>{
  const {data}=await sb.auth.getSession();user=data.session?.user||null;
  if(user){try{await loadAll();subscribe();}catch(err){fail(err);}}
  render();
})();
</script>
</body>
</html>
