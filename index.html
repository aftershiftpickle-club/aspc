<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aftershift Pickleclub</title>
<meta name="description" content="Aftershift Pickleclub — a Dubai pickleball community. Session rankings and how to join.">
<script>
/* pick light or dark before the page draws, so it never flashes */
(function(){var t;try{t=localStorage.getItem('aspc-theme')}catch(e){}
  var d=t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme=d?'dark':'light';})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23B5C42F'/%3E%3Cg fill='%2324211C'%3E%3Ccircle cx='11' cy='10' r='2.4'/%3E%3Ccircle cx='21' cy='9' r='2.4'/%3E%3Ccircle cx='16' cy='17' r='2.4'/%3E%3Ccircle cx='9' cy='20' r='2.4'/%3E%3Ccircle cx='23' cy='19' r='2.4'/%3E%3Ccircle cx='16' cy='26' r='2.4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   COLOURS — light mode first, dark mode underneath.
   Change any hex code here and the whole site follows.
   ============================================================ */
:root{
  --bg:#EEEDEC;          /* page background              */
  --card:#F7F6F4;        /* cards (a touch lighter)      */
  --soft:#E1E0DE;        /* secondary surface            */
  --ink:#24211C;         /* primary text                 */
  --muted:#6E733B;       /* muted text                   */
  --line:#D7D5D1;        /* subtle borders               */
  --accent:#B5C42F;      /* lime: buttons, highlights    */
  --accent-ink:#24211C;  /* text on lime                 */
  --accent-text:#66740F; /* lime used as TEXT (readable) */
  --logo-lime:#A9BC2A;   /* ball + PICKLECLUB in the logo */
  --band:#24211C;        /* the "Join" band              */
  --band-ink:#F0EFEC;
  --band-muted:#C9C7C1;
  --gold:#9FAE1E;        /* 1st place                    */
  --silver:#A9A7A1;      /* 2nd place                    */
  --bronze:#B98A63;      /* 3rd place                    */
  --live:#D0553F;        /* red "Live" dot               */
  --hover:#F1F0EE;
  --loser:#9A978F;
  --orgrow:#E8E7E4;
  --topbar:rgba(238,237,236,.9);
  --glow:rgba(181,196,47,.30);
  --dots:rgba(36,33,28,.08);
  --stripes:rgba(181,196,47,.24);
  --shadow:0 1px 2px rgba(36,33,28,.05),0 10px 26px -20px rgba(36,33,28,.35);
  --r:16px;
  --serif:"DM Serif Display",Georgia,serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html[data-theme="dark"]{
  --bg:#171715;
  --card:#242320;
  --soft:#2E2D29;
  --ink:#F0EFEC;
  --muted:#AEB876;
  --line:#393831;
  --accent:#C2D437;
  --accent-ink:#171715;
  --accent-text:#C2D437;
  --logo-lime:#C2D437;
  --band:#242320;
  --band-ink:#F0EFEC;
  --band-muted:#AEB876;
  --gold:#C2D437;
  --silver:#8F8D86;
  --bronze:#C08A5E;
  --hover:#2A2925;
  --loser:#7C7A73;
  --orgrow:#1E1D1A;
  --topbar:rgba(23,23,21,.88);
  --glow:rgba(194,212,55,.16);
  --dots:rgba(240,239,236,.06);
  --stripes:rgba(194,212,55,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--muted);font:400 16px/1.6 var(--sans);transition:background .25s,color .25s}
h1,h2,h3{margin:0;line-height:1.1;color:var(--ink)}
a{color:inherit}
img{display:block;max-width:100%}
.wrap{width:min(1100px,100% - 2.5rem);margin-inline:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
::selection{background:var(--accent);color:var(--accent-ink)}

.eyebrow{display:flex;align-items:center;justify-content:center;gap:.85rem;
  font-size:.72rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--ink)}
.eyebrow::before,.eyebrow::after{content:"";height:2px;width:30px;background:var(--accent);flex:none}

/* ---------- LOGO ----------
   One drawing, used in both modes — only the colours change.
   Make it bigger or smaller by changing the heights below.     */
.logo{display:block;width:auto;height:64px;overflow:visible}
.lg-ink{fill:var(--ink)}
.lg-lime{fill:var(--logo-lime)}
.lg-hole{fill:var(--bg)}
.lg-dash{stroke:var(--logo-lime);stroke-width:3;stroke-linecap:round}
.lg-word{font-family:var(--sans);font-weight:800}
.lg-sub{font-family:var(--sans);font-weight:700}
.foot-logo .logo{height:56px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--topbar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar__in{display:flex;align-items:center;gap:1rem;min-height:78px;flex-wrap:wrap}
.brand{display:flex;align-items:center;text-decoration:none;margin-right:auto;padding:.45rem 0}
.nav{display:flex;gap:.15rem;flex-wrap:wrap;align-items:center;padding-bottom:.3rem}
.nav a{text-decoration:none;padding:.5rem .85rem;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted)}
.nav a:hover{color:var(--ink);background:var(--soft)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .livelink{display:inline-flex;align-items:center;gap:.4rem}
.nav .livelink i{width:7px;height:7px;border-radius:50%;background:var(--live);animation:livepulse 1.4s infinite}
@keyframes livepulse{50%{opacity:.3}}
.theme-btn{margin-left:.3rem;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink);font-size:1.05rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.theme-btn:hover{border-color:var(--accent)}

/* ---------- date + division bar ---------- */
.datebar{background:var(--card);border-bottom:1px solid var(--line)}
.datebar__in{display:flex;align-items:center;gap:.7rem 1.1rem;flex-wrap:wrap;padding:.85rem 0}
.datebar label{font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
select{
  font:600 .95rem/1 var(--sans);color:var(--ink);
  padding:.62rem 2.2rem .62rem .85rem;border:1.5px solid var(--line);border-radius:10px;
  background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23939A45' stroke-width='2'/></svg>") no-repeat right .85rem center;
  -webkit-appearance:none;appearance:none;cursor:pointer;
}
select:hover{border-color:var(--accent)}
.seg{display:flex;gap:3px;background:var(--soft);border-radius:999px;padding:3px}
.seg button{font:700 .78rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);cursor:pointer;border:0;background:none;padding:.55rem .95rem;border-radius:999px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[data-empty="1"]{opacity:.45}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-left:auto}
.chip{font-size:.78rem;color:var(--muted);border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.32rem .75rem}
.chip b{font-weight:800;color:var(--ink)}

/* ---------- hero / podium ---------- */
.court{position:relative;overflow:hidden;padding:2.8rem 0 3rem;
  background:
    radial-gradient(60% 50% at 50% 105%, var(--glow), transparent 70%),
    radial-gradient(circle, var(--dots) 1.3px, transparent 1.5px) 0 0/16px 16px,
    linear-gradient(var(--bg),var(--soft))}
.court::before,.court::after{content:"";position:absolute;top:-20%;height:150%;width:120px;transform:skewX(-18deg);
  background:repeating-linear-gradient(90deg,var(--stripes) 0 14px,transparent 14px 34px);pointer-events:none}
.court::before{left:-40px}
.court::after{right:-40px}
.court__in{position:relative;text-align:center}
.court h1{font-family:var(--serif);font-weight:400;font-style:italic;color:var(--ink);
  font-size:clamp(2.8rem,9vw,5.2rem);letter-spacing:-.01em;margin-bottom:.55rem}
.court__date{font-size:1rem;font-weight:700;color:var(--ink);margin:.9rem 0 1.4rem;letter-spacing:.03em}
.court__empty{color:var(--muted);padding:1.5rem 0 .5rem}

.podium{display:grid;grid-template-columns:1fr 1.22fr 1fr;gap:1rem;align-items:end;text-align:center}
.pod{--rim:var(--silver);display:flex;flex-direction:column;align-items:center;gap:.7rem}
.pod--1{--rim:var(--gold)}
.pod--3{--rim:var(--bronze)}
.pod__photo{width:88px;height:88px;border-radius:50%;object-fit:cover;flex:none;
  background:var(--card);border:3px solid var(--rim);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font:800 1.5rem var(--sans);color:var(--ink)}
.pod--1 .pod__photo{width:108px;height:108px;font-size:1.9rem}

/* Cut-out podium photos. Resize a place by changing BOTH its
   .pod__figure height and its .pod__cut height to the same value. */
.pod__figure{position:relative;display:block;width:100%;height:396px;flex:none;margin-bottom:-1.5rem;z-index:1}
.pod--1 .pod__figure{height:404px}
.pod--3 .pod__figure{height:376px}
.pod__cut{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  height:396px;width:auto;max-width:165%;object-fit:contain;object-position:bottom center;
  filter:drop-shadow(0 12px 16px rgba(0,0,0,.3));pointer-events:none}
.pod--1 .pod__cut{height:404px}
.pod--3 .pod__cut{height:376px}
.pod__plate,.pod__cyl{position:relative;z-index:2}
.pod__plate{width:100%;background:var(--card);border:2px solid var(--rim);border-radius:10px;
  padding:.5rem .7rem;font-weight:800;font-size:.95rem;color:var(--ink);line-height:1.25;box-shadow:var(--shadow)}
.pod--1 .pod__plate{font-size:1.1rem;padding:.62rem .8rem}
.pod__cyl{width:100%;min-height:218px;padding:2.6rem .8rem 1.3rem;
  border:2px solid var(--rim);border-radius:50% / 9%;
  background:radial-gradient(120% 70% at 50% 0%,var(--card),var(--soft) 85%);
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.5rem}
.pod--1 .pod__cyl{min-height:278px;padding-top:3rem}
.pod--3 .pod__cyl{min-height:206px}
.pod__cyl::before{content:"";position:absolute;left:7%;right:7%;top:9px;height:26px;
  border:2px solid var(--rim);border-radius:50%;background:var(--card)}
.pod__rank{margin:0 0 auto;text-align:center;font:800 2.1rem/1 var(--sans);color:var(--rim)}
.pod--1 .pod__rank{font-size:3rem}
.pod__rank small{display:block;font-size:.4em;font-weight:700;letter-spacing:.24em;line-height:1.2;
  text-transform:uppercase;margin-top:.45em;color:var(--ink);opacity:.7}
.pod--1 .pod__rank small{font-size:.28em}
.pod__bar{border:1.5px solid var(--rim);border-radius:8px;padding:.34rem .5rem;
  font-size:.8rem;font-weight:600;color:var(--muted);background:var(--card)}
.pod__bar b{color:var(--ink);font-weight:800}

/* ---------- sections ---------- */
.section{padding:2.8rem 0 3.2rem}
.section__head{margin-bottom:1.1rem}
.section__head h2{font-family:var(--serif);font-weight:400;font-size:2rem;letter-spacing:-.005em}
.section__head p{margin:.35rem 0 0;color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse}
th,td{padding:.75rem .6rem;text-align:right;border-bottom:1px solid var(--line);color:var(--ink)}
th{font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{padding-left:1rem;text-align:center;width:3.4rem}
th:nth-child(2),td:nth-child(2){text-align:left;width:auto}
th:last-child,td:last-child{padding-right:1rem}
tbody tr:hover{background:var(--hover)}
.rk{font:800 1.15rem var(--sans);color:var(--accent-text)}
.who{display:flex;align-items:center;gap:.7rem;min-width:0}
.who .avatar{width:38px;height:38px;flex:none;border-radius:50%;object-fit:cover;background:var(--soft);
  border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  font:800 .8rem var(--sans);color:var(--accent-text)}
.who span{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.w{color:var(--accent-text);font-weight:800}
td.l{color:var(--muted)}
.pct{font-weight:800;font-variant-numeric:tabular-nums}
.diff{font-variant-numeric:tabular-nums;color:var(--muted)}
.diff.up{color:var(--accent-text);font-weight:700}
.strk{font-weight:800;font-variant-numeric:tabular-nums}
.strk.sw{color:var(--accent-text)}
.strk.sl{color:var(--muted)}
tr.org td{background:var(--orgrow)}
tr.org .rk{color:var(--loser);font-size:1rem}
tr.org .who span{color:var(--muted)}
.tag-o{font-style:normal;font-size:.58rem;font-weight:800;letter-spacing:.12em;color:var(--muted);
  border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.12rem .4rem;margin-left:.45rem;vertical-align:middle}

/* ---------- games ---------- */
.games{display:grid;gap:.6rem}
.game{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  display:grid;grid-template-columns:2.4rem 1fr auto 1fr;align-items:center;gap:.4rem 1rem;padding:.95rem 1.1rem}
.game__no{font:800 1.15rem var(--sans);color:var(--loser)}
.side{min-width:0}
.side--b{text-align:right}
.side p{margin:0;font-weight:600;line-height:1.3;color:var(--loser)}
.side em{font-style:normal;font-size:.66rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:transparent}
.side--won p{color:var(--ink);font-weight:800}
.side--won em{color:var(--accent-text)}
.score{font:800 1.35rem var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:.25rem .75rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.score .lo{color:var(--loser)}

/* ---------- photos ---------- */
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.1rem}
.album{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.album__cover{aspect-ratio:16/10;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle, var(--dots) 1.3px, transparent 1.5px) 0 0/15px 15px,
    linear-gradient(135deg,var(--soft),var(--card))}
.album__cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1}
.album__cover span{position:relative;font-family:var(--serif);color:var(--ink);font-size:1.3rem;text-align:center;padding:0 1rem}
.album__cover:has(img)::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(0,0,0,.7),transparent 55%)}
.album__cover:has(img) span{position:absolute;left:14px;bottom:10px;z-index:3;color:#F0EFEC;padding:0;text-align:left}
.album__body{padding:1.05rem 1.15rem 1.25rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.album__body h3{font-size:1.02rem;font-weight:800}
.album__body p{margin:0;color:var(--muted);font-size:.88rem}

/* ---------- buttons ---------- */
.btn{margin-top:auto;align-self:start;display:inline-block;text-decoration:none;
  background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.76rem;letter-spacing:.12em;
  text-transform:uppercase;padding:.7rem 1.15rem;border-radius:999px;transition:filter .2s,background .2s}
.btn:hover{filter:brightness(1.08)}
.btn--quiet{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn--quiet:hover{background:var(--soft);filter:none}

/* ---------- join band under the standings ---------- */
.hero{background:var(--band);margin-top:1rem}
.hero__in{padding:2.8rem 0 2.6rem;display:grid;gap:.9rem;max-width:46rem}
.hero .eyebrow{color:var(--accent)}
.eyebrow--left{justify-content:flex-start}
.eyebrow--left::after{display:none}
.hero h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,6.5vw,3.5rem);color:var(--band-ink)}
.hero p{margin:0;color:var(--band-muted);max-width:56ch}
.hero__cta{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.35rem}
.hero__cta .btn{margin-top:0;align-self:center}
.hero__cta .btn--quiet{color:var(--band-ink);box-shadow:inset 0 0 0 1.5px rgba(240,239,236,.35)}
.hero__cta .btn--quiet:hover{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}

/* ---------- join page ---------- */
.stack{display:grid;gap:1.1rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.6rem;box-shadow:var(--shadow);display:flex;flex-direction:column}
.panel > h3{font-family:var(--serif);font-weight:400;font-size:1.6rem}
.panel__tag{font-size:.72rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text);margin:.45rem 0 0}
.panel p{margin:.85rem 0 0;max-width:72ch}
.panel .btn{margin-top:1.3rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem 1.4rem;
  margin:1.1rem 0 0;padding-top:1.1rem;border-top:1px solid var(--line)}
.kv dt{font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:.25rem 0 0;font-weight:700;color:var(--ink)}
.jstep{position:relative;padding-top:1.4rem}
.jstep__n{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font:800 1.05rem var(--sans);margin-bottom:.9rem}
.jstep h3{font-family:var(--sans);font-weight:800;font-size:1.1rem}
.jstep ul{list-style:none;padding:0;margin:.8rem 0 0;display:grid;gap:.35rem}
.txtlink{color:var(--ink);font-weight:700;text-decoration-color:var(--accent);text-underline-offset:3px}
.txtlink:hover{color:var(--accent-text)}
.note{border-left:3px solid var(--accent);padding:.1rem 0 .1rem 1rem;margin-top:1.1rem}
.note p{margin:0}
.subhead{margin:2.6rem 0 1rem;font-family:var(--serif);font-weight:400;font-size:1.6rem;color:var(--ink)}

/* ---------- top players of the month (always dark, to match the posters) ---------- */
.topband{background:#171715;padding:2.6rem 0 3.4rem}
.topband h1{font-family:var(--serif);font-style:italic;font-weight:400;color:#F0EFEC;
  font-size:clamp(2.6rem,8vw,4.4rem);text-align:center;margin-bottom:.4rem}
.topband .empty{color:#AEB876}
.month + .month{margin-top:3.2rem;padding-top:2.4rem;border-top:1px solid #393831}
.month__title{margin:0;text-align:center;font-size:.8rem;font-weight:700;letter-spacing:.3em;
  text-transform:uppercase;color:#C2D437}
.month__div{display:flex;justify-content:space-between;align-items:baseline;margin:1.8rem 0 .7rem;
  font-size:.74rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#C2D437}
.month__div small{display:none;letter-spacing:.04em;text-transform:none;font-weight:600;color:#AEB876}
.posters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.poster{display:block;text-decoration:none;border-radius:14px;overflow:hidden;background:#242320;border:1px solid #393831}
.poster:hover{border-color:#C2D437}
.poster img{width:100%;aspect-ratio:4/5;object-fit:cover}
.poster span{display:block;padding:.55rem;text-align:center;font-weight:800;font-size:.92rem;color:#F0EFEC}

footer{border-top:1px solid var(--line);padding:1.7rem 0 2.6rem;color:var(--muted);font-size:.78rem;
  letter-spacing:.14em;text-transform:uppercase;font-weight:700;display:flex;gap:1rem 1.5rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer a{color:var(--ink);text-decoration:none}
footer a:hover{color:var(--accent-text)}
.empty{padding:2rem;text-align:center;color:var(--muted)}
[hidden]{display:none !important}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .wrap{width:min(1100px,100% - 1.6rem)}
  .logo{height:56px}
  .court{padding:1.8rem 0 2.2rem}
  .court::before,.court::after{width:70px}
  .podium{grid-template-columns:1fr;gap:.8rem;align-items:stretch}

<script>
/* ---------- database (Supabase) ----------
   Players and games come from the database (filled in from
   admin.html). If it can't be reached, the site falls back to
   PLAYERS and MATCHES in data.js, so it never shows a blank page. */
const SUPABASE_URL = "https://wczulosdzoewznxlawfj.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZPRnMslT6BWplkRvVaiRXA_PUh-bQlO";

let ROSTER = PLAYERS;
let GAMES  = MATCHES;

async function loadFromDatabase(){
  const get = path => fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: SUPABASE_KEY } })
    .then(r => { if (!r.ok) throw new Error("Database said " + r.status); return r.json(); });
  const getAll = async path => {
    let out = [], from = 0;
    while (true){
      const rows = await get(`${path}&limit=1000&offset=${from}`);
      out = out.concat(rows);
      if (rows.length < 1000) return out;
      from += 1000;
    }
  };
  try {
    const [players, allMatches, published] = await Promise.all([
      getAll("players?select=id,name,photo_url,organiser&order=id"),
      getAll("matches?select=session_id,session_date,division,game,team1,team2,score1,score2&order=session_date,id"),
      getAll("sessions?select=id&published=eq.true")
    ]);
    const pub = new Set(published.map(s => s.id));
    /* Social play is kept for organisers only (admin page). Its games
       never appear on the website, even if the session was published. */
    const matches = allMatches.filter(m => pub.has(m.session_id) && m.division !== "social");
    const extra = Object.fromEntries(PLAYERS.map(p => [p.id, p]));
    const fromDb = players.map(p => ({
      ...(extra[p.id] || {}),
      id: p.id,
      name: p.name,
      photo: p.photo_url || (extra[p.id] && extra[p.id].photo) || "",
      organiser: (extra[p.id] && extra[p.id].organiser !== undefined)
        ? extra[p.id].organiser : !!p.organiser
    }));
    const inDb = new Set(fromDb.map(p => p.id));
    ROSTER = fromDb.concat(PLAYERS.filter(p => !inDb.has(p.id)));

    const dbGames = matches.map(m => ({
      date: m.session_date, div: m.division, game: m.game,
      team1: m.team1, team2: m.team2, score1: m.score1, score2: m.score2
    }));
    /* SAFETY NET: sessions only in data.js still show. If a date is
       in both, the database wins.                                   */
    const dbDates = new Set(dbGames.map(g => g.date));
    GAMES = dbGames.concat(MATCHES.filter(m => !dbDates.has(m.date)));
  } catch (err){
    console.warn("Could not reach the database — showing data.js instead.", err);
  }
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
let byId = {};
const nameOf = id => (byId[id] ? byId[id].name : id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const isTba = v => !v || /^\s*tba\b/i.test(String(v));

function fmtDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
}
function todayIso(){
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
}
function initials(name){
  return name.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join("");
}
function ordinal(n){
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* ---------- light / dark switch ---------- */
$("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { localStorage.setItem("aspc-theme", dark ? "dark" : "light"); } catch(e){}
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
  let saved; try { saved = localStorage.getItem("aspc-theme"); } catch(_){}
  if (!saved) document.documentElement.dataset.theme = e.matches ? "dark" : "light";
});

/* Player photos: admin upload first, then photos/<id>.jpg/.jpeg/.png/.webp,
   then initials. Add focus:"50% 20%" to a player in data.js to nudge
   their photo inside the circle.                                        */
const PHOTO_EXTS = ["jpg","jpeg","png","webp"];
function avatar(player, cls){
  const id = player.id || "";
  const src = player.photo || (id ? `photos/${id}.${PHOTO_EXTS[0]}` : "");
  const c = cls || "avatar";
  if (!src) return `<div class="${c}" aria-hidden="true">${initials(player.name)}</div>`;
  const focus = player.focus ? ` style="object-position:${player.focus}"` : "";
  return `<img class="${c}" src="${src}" alt="${player.name}"${focus}
    data-name="${player.name}" data-id="${id}" data-step="${player.photo ? "custom" : "0"}">`;
}

/* Podium: photos/cutouts/<id>.png if it exists, else round photo, else initials. */
function podiumPhoto(player){
  const id = player.id || "";
  if (!id) return avatar(player, "pod__photo");
  return `<span class="pod__figure">
    <img class="pod__cut" src="photos/cutouts/${id}.png" alt="${player.name}"
      data-name="${player.name}" data-id="${id}" data-step="cutout">
  </span>`;
}

document.addEventListener("error", e => {
  const el = e.target;
  if (el.tagName !== "IMG") return;
  if (el.classList.contains("album__img")) { el.remove(); return; }
  if (el.classList.contains("poster__img")) { el.closest(".poster").remove(); return; }
  if (el.classList.contains("pod__cut")){
    const figure = el.closest(".pod__figure") || el;
    const player = byId[el.dataset.id] || { id: el.dataset.id, name: el.dataset.name };
    figure.outerHTML = avatar(player, "pod__photo");
    return;
  }
  if (!el.classList.contains("avatar") && !el.classList.contains("pod__photo")) return;
  const step = el.dataset.step, id = el.dataset.id, name = el.dataset.name || "";
  const next = (step === "custom" || !id) ? PHOTO_EXTS.length : Number(step) + 1;
  if (next < PHOTO_EXTS.length){
    el.dataset.step = next;
    el.src = `photos/${id}.${PHOTO_EXTS[next]}`;
    return;
  }
  const box = document.createElement("div");
  box.className = el.className;
  box.textContent = initials(name);
  box.setAttribute("aria-hidden","true");
  el.replaceWith(box);
}, true);

/* ---------- ranking logic ----------
   Sessions on or after NEW_RULE_FROM:
     1. most wins   2. highest win %   3. best point difference
   Earlier sessions keep the old order so past podiums don't change:
     1. highest win %   2. best streak   3. best point difference
   Organisers are listed at the bottom with /O, outside the ranking.

   To apply the new rule to an earlier session too, move the date
   below back (for example "2026-09-01").                          */
const NEW_RULE_FROM = "2026-10-01";

function gamesOn(date, div){
  return GAMES.filter(m => m.date === date && (m.div || "regular") === div);
}
function streakOf(seq){
  if (!seq.length) return 0;
  const last = seq[seq.length - 1];
  let n = 0;
  for (let i = seq.length - 1; i >= 0 && seq[i] === last; i--) n++;
  return last === "W" ? n : -n;
}
function streakText(s){ return s ? Math.abs(s) + (s > 0 ? "W" : "L") : "—"; }

function standings(date, div){
  const rows = {};
  const seen = p => rows[p] || (rows[p] = { id:p, name:nameOf(p), wins:0, losses:0, diff:0, seq:[] });
  gamesOn(date, div).slice().sort((a,b) => (a.game || 0) - (b.game || 0)).forEach(m => {
    const t1won = m.score1 > m.score2;
    const margin = m.score1 - m.score2;
    m.team1.forEach(p => {
      const r = seen(p); r.diff += margin; r.seq.push(t1won ? "W" : "L");
      t1won ? r.wins++ : r.losses++;
    });
    m.team2.forEach(p => {
      const r = seen(p); r.diff -= margin; r.seq.push(t1won ? "L" : "W");
      t1won ? r.losses++ : r.wins++;
    });
  });
  const list = Object.values(rows).map(r => {
    const gp = r.wins + r.losses;
    const player = byId[r.id] || { id:r.id, name:r.name, photo:"" };
    return { ...r, gp, pct: gp ? Math.round(r.wins / gp * 100) : 0,
             streak: streakOf(r.seq), player,
             organiser: Array.isArray(player.organiser)
               ? player.organiser.includes(div) : !!player.organiser };
  });
  const byWins = date >= NEW_RULE_FROM;
  const order = (a,b) => (byWins
      ? b.wins - a.wins || b.pct - a.pct
      : b.pct - a.pct || b.streak - a.streak)
    || b.diff - a.diff || a.name.localeCompare(b.name);
  const ranked     = list.filter(r => !r.organiser).sort(order);
  const organisers = list.filter(r =>  r.organiser).sort(order);
  const all = ranked.concat(organisers);
  all.forEach((r,i) => r.rank = i + 1);
  return all;
}

let dates = [];
let current;
let currentDiv = DIVISIONS[0].id;
const divName = id => (DIVISIONS.find(d => d.id === id) || {}).name || id;

function ensureDivision(){
  if (gamesOn(current, currentDiv).length) return;
  const played = DIVISIONS.find(d => gamesOn(current, d.id).length);
  if (played) currentDiv = played.id;
}

/* ---------- rankings & games ---------- */
function renderRankings(){
  if (!current){
    $("courtSub").textContent = `${divName(currentDiv)} session results`;
    $("courtTitle").textContent = "No sessions recorded yet";
    $("standingsHead").textContent = `${divName(currentDiv)} standings`;
    $("standingsNote").textContent = "";
    $("podium").innerHTML = `<p class="court__empty">No ${divName(currentDiv)} games recorded yet.</p>`;
    $("tableBody").innerHTML = `<tr><td colspan="8" class="empty">No ${divName(currentDiv)} results yet.</td></tr>`;
    $("chips").innerHTML = "";
    return;
  }
  const list = standings(current, currentDiv);
  const played = gamesOn(current, currentDiv).length;

  $("courtSub").textContent = `${divName(currentDiv)} session results`;
  $("courtTitle").textContent = fmtDate(current);
  $("standingsHead").textContent = `${divName(currentDiv)} standings`;
  $("standingsNote").textContent = !list.length ? ""
    : current >= NEW_RULE_FROM ? "Ranked by most wins, then win %, then point difference"
    : "Ranked by win %, then streak, then point difference";

  const podiumList = list.filter(r => !r.organiser);
  const order = [1,0,2]; // 2nd, 1st, 3rd
  $("podium").innerHTML = !podiumList.length
    ? `<p class="court__empty">No ${divName(currentDiv)} games recorded for this session yet.</p>`
    : order.map(i => {
        const r = podiumList[i];
        if (!r) return "";
        return `<article class="pod pod--${i + 1}">
          ${podiumPhoto(r.player)}
          <div class="pod__plate">${r.name}</div>
          <div class="pod__cyl">
            <div class="pod__rank">${ordinal(r.rank)}<small>place</small></div>
            <div class="pod__bar">Win rate: <b>${r.pct}%</b></div>
            <div class="pod__bar">Win / loss: <b>${r.wins}&#8211;${r.losses}</b></div>
          </div>
        </article>`;
      }).join("");

  $("tableBody").innerHTML = list.length
    ? list.map(r => `<tr class="${r.organiser ? "org" : ""}">
        <td class="rk">${r.rank}</td>
        <td><div class="who">${avatar(r.player)}<span>${r.name}${r.organiser ? `<i class="tag-o">/O</i>` : ""}</span></div></td>
        <td class="w">${r.wins}</td>
        <td class="l">${r.losses}</td>
        <td>${r.gp}</td>
        <td class="pct">${r.pct}%</td>
        <td class="diff hide-sm ${r.diff > 0 ? "up" : ""}">${r.diff > 0 ? "+" + r.diff : r.diff}</td>
        <td class="strk hide-sm ${r.streak > 0 ? "sw" : "sl"}">${streakText(r.streak)}</td>
      </tr>`).join("")
    : `<tr><td colspan="8" class="empty">No ${divName(currentDiv)} results for this session yet.</td></tr>`;

  $("chips").innerHTML = list.length
    ? `<span class="chip"><b>${list.length}</b> players</span>
       <span class="chip"><b>${played}</b> games</span>`
    : "";
}

function renderGames(){
  const games = gamesOn(current, currentDiv).slice().sort((a,b) => a.game - b.game);
  $("gamesTitle").textContent = `${divName(currentDiv)} games`;
  $("gamesList").innerHTML = games.length
    ? games.map(m => {
        const t1won = m.score1 > m.score2;
        const team = ids => ids.map(nameOf).join(" + ");
        return `<article class="game">
          <div class="game__no">${m.game}</div>
          <div class="side ${t1won ? "side--won" : ""}">
            <p>${team(m.team1)}</p>
            <em>${t1won ? "Winner" : "&nbsp;"}</em>
          </div>
          <div class="score"><span>${m.score1}</span><span class="lo"> – </span><span>${m.score2}</span></div>
          <div class="side side--b ${!t1won ? "side--won" : ""}">
            <p>${team(m.team2)}</p>
            <em>${!t1won ? "Winner" : "&nbsp;"}</em>
          </div>
        </article>`;
      }).join("")
    : `<div class="card empty">No ${divName(currentDiv)} games recorded for this session yet.</div>`;
}

function renderAlbums(){
  $("galleryTitle").textContent = (typeof GALLERY !== "undefined" && GALLERY.title) || "Photos";
  const list = [...ALBUMS].sort((a,b) => b.date.localeCompare(a.date));
  $("albumList").innerHTML = list.length
    ? list.map(a => `<article class="album">
        <div class="album__cover">
          <span>${fmtDate(a.date)}</span>
          <img class="album__img" src="${a.cover || `photos/albums/${a.date}.jpg`}" alt="">
        </div>
        <div class="album__body">
          <h3>${esc(a.title)}</h3>
          <p>${esc(a.description || "")}</p>
          <a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">View photos</a>
        </div>
      </article>`).join("")
    : `<div class="card empty">No albums added yet.</div>`;
}

/* ---------- top players of the month (MONTHLY in data.js + photos/top/) ---------- */
function renderMonthly(){
  const months = (typeof MONTHLY !== "undefined" ? [...MONTHLY] : [])
    .sort((a,b) => b.month.localeCompare(a.month));
  $("monthList").innerHTML = months.length
    ? months.map(m => `<div class="month">
        <p class="month__title">${esc(m.title)}</p>
        ${DIVISIONS.map(d => {
          const pre = d.id.slice(0,3), names = (m.names && m.names[d.id]) || [];
          return `<div class="month__div"><span>${esc(d.name)}</span><small>swipe →</small></div>
          <div class="posters">${[1,2,3].map(n => {
            const src = `photos/top/${m.month}/${pre}-${n}.jpg`;
            return `<a class="poster" href="${src}" target="_blank" rel="noopener">
              <img class="poster__img" src="${src}" loading="lazy" alt="${esc(d.name)} ${ordinal(n)} place, ${esc(m.title)}">
              ${names[n-1] ? `<span>${esc(names[n-1])}</span>` : ""}</a>`;
          }).join("")}</div>`;
        }).join("")}
      </div>`).join("")
    : `<p class="empty">Top players will be announced soon.</p>`;
}

/* ---------- header, footer, join band ---------- */
function renderClub(){
  document.title = `${CLUB.name} — ${CLUB.tagline}`;
  /* the footer uses the same logo drawing as the header */
  $("footLogo").innerHTML = document.querySelector(".brand .logo").outerHTML;
  $("footText").textContent = CLUB.established ? `${CLUB.name} — ${CLUB.established}` : CLUB.name;
  $("footLinks").innerHTML = SOCIAL.filter(s => s.url && /instagram/i.test(s.label))
    .map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.handle)}</a>`).join("");
}

function renderHero(){
  $("heroEyebrow").textContent = HERO.eyebrow;
  $("heroHeadline").textContent = HERO.headline;
  $("heroText").textContent = HERO.text;
  $("heroCta").innerHTML =
    `<a class="btn" href="${esc(REGISTRATION_FORM)}" target="_blank" rel="noopener">Register for a session</a>
     <a class="btn btn--quiet" href="#/join">How to join</a>`;
}

/* ---------- JOIN page ----------
   Built from data.js, so you still edit the words there.
   Anything marked "TBA" is left out automatically.        */
const kv = list => {
  const shown = (list || []).filter(d => !isTba(d.value));
  return shown.length
    ? `<dl class="kv">${shown.map(d => `<div><dt>${esc(d.label)}</dt><dd>${esc(d.value)}</dd></div>`).join("")}</dl>`
    : "";
};
const waList = people => `<ul>${people.map(p =>
  `<li>${esc(p.name)} — <a class="txtlink" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.label)}</a></li>`).join("")}</ul>`;

function renderJoin(){
  const A = ANNOUNCEMENTS;
  $("joinIntro").textContent = "Three steps and you're on court.";

  $("joinSteps").innerHTML = `
    <article class="panel jstep">
      <span class="jstep__n">1</span>
      <h3>Register</h3>
      <p>Fill in the ASPC form for the session you want. One form covers every session.</p>
      <a class="btn" href="${esc(REGISTRATION_FORM)}" target="_blank" rel="noopener">Open the form</a>
    </article>
    <article class="panel jstep">
      <span class="jstep__n">2</span>
      <h3>Pay to confirm your slot</h3>
      <p>Your place is confirmed once payment is done. Send the receipt to:</p>
      ${waList(A.policy.payTo)}
      <div class="note"><p>Same-day cancellations are non-refundable.</p></div>
    </article>
    <article class="panel jstep">
      <span class="jstep__n">3</span>
      <h3>Check in and play</h3>
      <p>Arrive by 6:50 PM and check in with Bon or Jes. You join the queue and your name comes up on the Live screen.</p>
      <a class="btn btn--quiet" href="tv.html">See the Live screen</a>
    </article>`;

  $("joinSessions").innerHTML = SESSIONS.filter(s => s.button && s.button.url).map(s => `
    <article class="panel">
      <h3>${esc(s.name)}</h3>
      ${s.tagline ? `<p class="panel__tag">${esc(s.tagline)}</p>` : ""}
      ${kv((s.details || []).filter(d => !/^(maximum players|courts|skill level)$/i.test(d.label)))}
    </article>`).join("");

  const upcoming = A.items.filter(i => i.date >= todayIso());
  $("joinUpcomingWrap").hidden = !upcoming.length;
  $("joinUpcoming").innerHTML = upcoming.map(i => `
    <article class="panel">
      <h3>${esc(i.name)}</h3>
      <p class="panel__tag">${fmtDate(i.date)}</p>
      ${kv([{ label: "Time", value: i.time }])}
    </article>`).join("");

  $("joinWhere").innerHTML = `
    <article class="panel">
      <h3>Venue</h3>
      <p>${A.venue.lines.map(esc).join("<br>")}</p>
      <a class="btn btn--quiet" href="${esc(A.venue.mapUrl)}" target="_blank" rel="noopener">Open in Google Maps</a>
    </article>
    <article class="panel">
      <h3>Questions?</h3>
      <p>Message an organiser on WhatsApp.</p>
      ${waList(TEAM)}
    </article>`;
}

/* ---------- date and division selectors ---------- */
$("dateSelect").addEventListener("change", e => {
  current = e.target.value;
  ensureDivision();
  refresh();
});
function renderDivisions(){
  $("dateLabel").hidden = !dates.length;
  $("dateSelect").hidden = !dates.length;
  $("divSeg").hidden = DIVISIONS.length < 2;
  $("divSeg").innerHTML = DIVISIONS.map(d => {
    const empty = (dates.length && !gamesOn(current, d.id).length) ? ` data-empty="1"` : "";
    return `<button type="button" data-div="${d.id}" aria-pressed="${d.id === currentDiv}"${empty}>${d.name}</button>`;
  }).join("");
}
$("divSeg").addEventListener("click", e => {
  const btn = e.target.closest("button[data-div]");
  if (!btn) return;
  currentDiv = btn.dataset.div;
  refresh();
});
function refresh(){
  renderDivisions();
  renderRankings();
  renderGames();
}

/* ---------- navigation ----------
   Old links (#/sessions, #/schedule, #/about, #/faq) now open Join. */
const views = ["rankings","top","games","photos","join"];
const oldPages = ["sessions","schedule","about","faq"];
function route(){
  let name = (location.hash.replace("#/","") || "rankings").toLowerCase();
  if (oldPages.includes(name)) name = "join";
  const view = views.includes(name) ? name : "rankings";
  views.forEach(v => $("view-" + v).hidden = (v !== view));
  document.querySelectorAll("#nav a").forEach(a => {
    if (a.getAttribute("href") === "#/" + view) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });
  $("datebar").hidden = !(view === "rankings" || view === "games");
  $("hero").hidden = (view !== "rankings");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ---------- start ---------- */
renderClub();
renderHero();
renderAlbums();
renderMonthly();
renderJoin();
route();

(async function start(){
  await loadFromDatabase();
  byId = Object.fromEntries(ROSTER.map(p => [p.id, p]));
  dates = [...new Set(GAMES.map(m => m.date))].sort().reverse();
  current = dates[0];
  $("dateSelect").innerHTML = dates.map(d => `<option value="${d}">${fmtDate(d)}</option>`).join("");
  if (current) $("dateSelect").value = current;
  ensureDivision();
  refresh();
})();
</script>
</body>
</html>
