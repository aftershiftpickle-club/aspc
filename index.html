/* ============================================================
   COLOURS & FONTS — change the whole look from here

:root{
  --bg:#F6F7F3;        /* warm off-white page background   */
  --sage-l:#E3EADF;    /* light sage panels / table heads  */
  --sage:#A7B89F;      /* primary sage                     */
  --green:#4F6F52;     /* buttons and key accents          */
  --forest:#2F4132;    /* headings                         */
  --text:#647369;      /* body text                        */
  --beige:#D6C7A1;     /* soft beige accent                */
  --white:#FFFFFF;
  --line:#DDE3D8;      /* hairlines and card borders       */

  --silver:#A7B89F;    /* 2nd place                        */
  --bronze:#B98A63;    /* 3rd place                        */

  --r:16px;
  --serif:"DM Serif Display",Georgia,serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(47,65,50,.04),0 8px 24px -18px rgba(47,65,50,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--sans)}
h1,h2,h3{margin:0;line-height:1.1;color:var(--forest)}
a{color:inherit}
img{display:block;max-width:100%}
.wrap{width:min(1100px,100% - 2.5rem);margin-inline:auto}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:4px}
::selection{background:var(--green);color:#fff}
